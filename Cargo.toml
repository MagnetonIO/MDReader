[workspace]
resolver = "2"
members = [
    "crates/mdreader-connector-dropbox",
    "crates/mdreader-connector-google-drive",
    "crates/mdreader-domain",
    "crates/mdreader-ingest",
    "crates/mdreader-presentation",
    "scripts/release/verifier",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/catdb-project/mdreader"

# Shared basics only, carried over from the monorepo workspace this repo was
# extracted from. The platform crates are no longer members here -- they arrive
# as a single versioned `catdb-sdk` dependency, which is the whole point of the
# split: MDReader consumes CatDB the way any other application would.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
smol_str = { version = "0.3", features = ["serde"] }
proptest = "1"
insta = "1"
async-trait = "0.1"
tokio = "1"
tempfile = "3"
serde_yaml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
