[workspace]
resolver = "2"
members = [
    "crates/mdreader-core",
    "crates/mdreader-service",
    "crates/mdreader-mcp",
    "crates/mdreader-capture",
    "crates/mdreader-sync",
    "crates/mdreader-integrations",
    "crates/mdreader-provider",
    "crates/mdreader-credentials",
    "crates/mdreader-legacy-export",
    "crates/mdreader-profile",
    "crates/mdreader-mobile-transfer",
    "crates/mdreader-connector-dropbox",
    "crates/mdreader-connector-google-drive",
    "scripts/release/verifier",
    "src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/catdb-project/mdreader"

# MDReader-owned portable crates share only basic dependencies.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
smol_str = { version = "0.3", features = ["serde"] }
proptest = "1"
insta = "1"
async-trait = "0.1"
tokio = "1"
tempfile = "3"
serde_yaml = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
