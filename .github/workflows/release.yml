          NODE
      - name: Generate credentialed Windows bundle configuration inline
        id: generate-bundle-config-windows
        if: matrix.platform == 'windows'
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ vars.MDREADER_UPDATER_PUBLIC_KEY }}
