      - name: Verify exact platform bundle configuration
        id: verify-credentialed-release-config
        env:
          RELEASE_CONFIG_PATH: ${{ runner.temp }}/mdreader-release-config.json
          EXPECTED_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_RELEASE_PLATFORM: ${{ matrix.platform }}
          EXPECTED_RELEASE_TARGET: ${{ matrix.target }}
          EXPECTED_RELEASE_BUNDLES: ${{ matrix.bundles }}
          EXPECTED_UPDATER_PUBLIC_KEY_SHA256: ${{ needs.prepare.outputs.updater_public_key_sha256 }}
          WINDOWS_SIGNER_PATH: ${{ steps.verify-credential-boundaries.outputs.windows_signer_path }}
          WINDOWS_HOOK_PATH: ${{ steps.verify-credential-boundaries.outputs.windows_hook_path }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { appendFileSync, readFileSync } = require('node:fs');
          const { resolve } = require('node:path');
          const hash = (body) => createHash('sha256').update(body).digest('hex');
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`bundle config verifier is missing ${name}`);
            return value;
          };
          const platform = required('EXPECTED_RELEASE_PLATFORM');
          const target = required('EXPECTED_RELEASE_TARGET');
          const bundles = required('EXPECTED_RELEASE_BUNDLES');
          const tuples = {
            macos: ['universal-apple-darwin', 'dmg'],
            windows: ['x86_64-pc-windows-msvc', 'nsis'],
            linux: ['x86_64-unknown-linux-gnu', 'appimage,deb,rpm'],
          };
          const tuple = tuples[platform];
          if (!tuple || tuple[0] !== target || tuple[1] !== bundles) {
            throw new Error(`${platform} release target and bundle tuple is invalid`);
          }
          const config = JSON.parse(readFileSync(required('RELEASE_CONFIG_PATH'), 'utf8'));
          const updater = config.plugins?.updater;
          if (
            config.identifier !== 'dev.mdreader.app' ||
            config.version !== required('EXPECTED_RELEASE_VERSION') ||
            config.build?.beforeBuildCommand !== '' ||
            config.bundle?.createUpdaterArtifacts !== true ||
            updater?.endpoints?.length !== 1 ||
            updater.endpoints[0] !==
              'https://downloads.mdreader.dev/channels/stable/updater.json' ||
            hash(Buffer.from(updater.pubkey ?? '', 'utf8')) !==
              required('EXPECTED_UPDATER_PUBLIC_KEY_SHA256')
          ) {
            throw new Error('credentialed release config has the wrong product or updater identity');
          }
          const windows = config.bundle.windows;
          const macos = config.bundle.macOS;
          if (platform === 'windows') {
            const args = windows?.signCommand?.args;
            if (
              macos !== undefined ||
              windows?.digestAlgorithm !== 'sha256' ||
              windows?.timestampUrl !== 'http://timestamp.digicert.com' ||
              windows?.signCommand?.cmd !== 'pwsh' ||
              !Array.isArray(args) ||
              args.length !== 5 ||
              args[0] !== '-NoProfile' ||
              args[1] !== '-NonInteractive' ||
              args[2] !== '-File' ||
              args[4] !== '%1' ||
              resolve(String(args[3])).toLowerCase() !==
                resolve(required('WINDOWS_SIGNER_PATH')).toLowerCase() ||
              resolve(String(windows?.nsis?.installerHooks)).toLowerCase() !==
                resolve(required('WINDOWS_HOOK_PATH')).toLowerCase()
            ) {
              throw new Error('Windows release config is missing the exact reviewed NSIS installer hook or signer');
            }
          } else if (windows !== undefined) {
            throw new Error('non-Windows release config contains Windows signing state');
          }
          if (
            platform === 'macos' &&
            (macos?.minimumSystemVersion !== '12.0' ||
              typeof macos.signingIdentity !== 'string' ||
              macos.signingIdentity.length === 0)
          ) {
            throw new Error('macOS release config is missing its exact identity and minimum OS');
          }
          if (platform === 'linux' && macos !== undefined) {
            throw new Error('Linux release config contains macOS signing state');
          }
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `release_config_sha256=${hash(readFileSync(required('RELEASE_CONFIG_PATH')))}\n`,
          );
          NODE
      - name: Import macOS Developer ID certificate for bundling
        id: import-macos-cert
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MDREADER_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/mdreader-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mdreader-release.keychain-db"
          SEARCH_LIST_PATH="$RUNNER_TEMP/mdreader-keychain-search-list.txt"
          security list-keychains -d user |
            sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$SEARCH_LIST_PATH"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && ORIGINAL_KEYCHAINS+=("$keychain")
          done < "$SEARCH_LIST_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
      - name: Import Windows Authenticode certificate for bundling
        id: import-windows-cert
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERT_THUMBPRINT: ${{ steps.inspect-windows-cert.outputs.thumbprint }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'mdreader-release.pfx'
          $storeNonce = [byte[]]::new(16)
          [Security.Cryptography.RandomNumberGenerator]::Fill($storeNonce)
          $storeNonceHex = [Convert]::ToHexString($storeNonce)
          $storeName = "MDReaderRelease-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-$storeNonceHex"
          $storePath = "Cert:\LocalMachine\$storeName"
          if ($storeName -notmatch '^MDReaderRelease-[0-9]+-[0-9]+-[0-9A-F]{32}$') {
            throw "Windows per-run certificate store name is invalid"
          }
          "store_name=$storeName" >> $env:GITHUB_OUTPUT
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $collection = [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          try {
            $collection.Import($bytes, $password, $flags)
            $thumbprints = @($collection | ForEach-Object Thumbprint | Sort-Object -Unique)
            if ($thumbprints.Count -eq 0) { throw "Windows PFX contains no certificates" }
            $expectedThumbprint = $env:WINDOWS_CERT_THUMBPRINT
            if ($thumbprints -notcontains $expectedThumbprint) { throw "Windows PFX does not contain the inspected signing certificate" }
            New-Item -Path Cert:\LocalMachine -Name $storeName -ItemType Store -ErrorAction Stop | Out-Null
            "store_owned=true" >> $env:GITHUB_OUTPUT
            [IO.File]::WriteAllBytes($path, $bytes)
            $imported = @(Import-PfxCertificate -FilePath $path -Password $password -CertStoreLocation $storePath -ErrorAction Stop)
            $importedThumbprints = @($imported | ForEach-Object Thumbprint | Sort-Object -Unique)
            if (Compare-Object $thumbprints $importedThumbprints) { throw "Windows import did not persist the exact PFX certificate set" }
            $certificate = @($imported | Where-Object Thumbprint -eq $expectedThumbprint)
            if ($certificate.Count -ne 1) { throw "persisted Windows signing certificate does not match inspected thumbprint" }
            if (-not $certificate.HasPrivateKey) { throw "Windows signing certificate has no private key" }
          } finally {
            $collection | ForEach-Object Dispose
          }
      - name: Bundle, sign, and notarize macOS release with isolated runtime
        id: bundle-direct-release-macos
        if: matrix.platform == 'macos'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.MDREADER_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MDREADER_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MDREADER_APPLE_TEAM_ID }}
          NODE_EXECUTABLE: ${{ steps.verify-credential-boundaries.outputs.node_path }}
          TAURI_ENTRYPOINT: ${{ steps.verify-credential-boundaries.outputs.tauri_entrypoint }}
          BUNDLE_WORKSPACE: ${{ steps.verify-credential-boundaries.outputs.bundle_workspace }}
        run: |
          cd "$BUNDLE_WORKSPACE/apps/mdreader/src-tauri"
          export CARGO_TARGET_DIR="$BUNDLE_WORKSPACE/target"
          exec "$NODE_EXECUTABLE" "$TAURI_ENTRYPOINT" bundle \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --features direct-updater \
            --config "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Bundle and sign Windows release with isolated runtime
        id: bundle-direct-release-windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERT_STORE: ${{ steps.import-windows-cert.outputs.store_name }}
          WINDOWS_CERT_STORE_OWNED: ${{ steps.import-windows-cert.outputs.store_owned }}
          WINDOWS_CERT_THUMBPRINT: ${{ steps.inspect-windows-cert.outputs.thumbprint }}
          NODE_EXECUTABLE: ${{ steps.verify-credential-boundaries.outputs.node_path }}
          TAURI_ENTRYPOINT: ${{ steps.verify-credential-boundaries.outputs.tauri_entrypoint }}
          BUNDLE_WORKSPACE: ${{ steps.verify-credential-boundaries.outputs.bundle_workspace }}
        run: |
          Set-Location -LiteralPath (Join-Path $env:BUNDLE_WORKSPACE 'apps\mdreader\src-tauri')
          $env:CARGO_TARGET_DIR = Join-Path $env:BUNDLE_WORKSPACE 'target'
          & $env:NODE_EXECUTABLE $env:TAURI_ENTRYPOINT bundle `
            --target '${{ matrix.target }}' `
            --bundles '${{ matrix.bundles }}' `
            --features direct-updater `
            --config (Join-Path $env:RUNNER_TEMP 'mdreader-release-config.json')
          if ($LASTEXITCODE -ne 0) {
            throw "isolated Windows Tauri bundler failed with exit code $LASTEXITCODE"
          }
      - name: Bundle and sign Linux updater with isolated runtime
        id: bundle-direct-release-linux
        if: matrix.platform == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          NODE_EXECUTABLE: ${{ steps.verify-credential-boundaries.outputs.node_path }}
          TAURI_ENTRYPOINT: ${{ steps.verify-credential-boundaries.outputs.tauri_entrypoint }}
          BUNDLE_WORKSPACE: ${{ steps.verify-credential-boundaries.outputs.bundle_workspace }}
        run: |
          cd "$BUNDLE_WORKSPACE/apps/mdreader/src-tauri"
          export CARGO_TARGET_DIR="$BUNDLE_WORKSPACE/target"
          exec "$NODE_EXECUTABLE" "$TAURI_ENTRYPOINT" bundle \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}" \
            --features direct-updater \
            --config "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Remove macOS signing material
        id: cleanup-macos-cert
        if: always() && matrix.platform == 'macos'
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/mdreader-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mdreader-release.keychain-db"
          SEARCH_LIST_PATH="$RUNNER_TEMP/mdreader-keychain-search-list.txt"
          RESTORED_LIST_PATH="$RUNNER_TEMP/mdreader-keychain-search-list-restored.txt"
          CLEANUP_FAILED=0
          if [[ -f "$SEARCH_LIST_PATH" ]]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && ORIGINAL_KEYCHAINS+=("$keychain")
            done < "$SEARCH_LIST_PATH"
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" || CLEANUP_FAILED=1
            security list-keychains -d user |
              sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$RESTORED_LIST_PATH" || CLEANUP_FAILED=1
            if ! cmp -s "$SEARCH_LIST_PATH" "$RESTORED_LIST_PATH"; then
              echo "macOS keychain search list restore residue remains" >&2
              CLEANUP_FAILED=1
            fi
          fi
          if [[ -e "$KEYCHAIN_PATH" ]] && ! security delete-keychain "$KEYCHAIN_PATH"; then
            CLEANUP_FAILED=1
          fi
          if [[ -e "$KEYCHAIN_PATH" ]]; then
            echo "macOS signing keychain residue remains" >&2
            CLEANUP_FAILED=1
          fi
          rm -f "$CERTIFICATE_PATH" "$SEARCH_LIST_PATH" "$RESTORED_LIST_PATH" || CLEANUP_FAILED=1
          for path in "$CERTIFICATE_PATH" "$SEARCH_LIST_PATH" "$RESTORED_LIST_PATH"; do
            if [[ -e "$path" ]]; then
              echo "macOS signing file residue remains at $path" >&2
              CLEANUP_FAILED=1
            fi
          done
          [[ "$CLEANUP_FAILED" -eq 0 ]]
      - name: Remove Windows signing material
        id: cleanup-windows-cert
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERT_STORE: ${{ steps.import-windows-cert.outputs.store_name }}
          WINDOWS_CERT_STORE_OWNED: ${{ steps.import-windows-cert.outputs.store_owned }}
          WINDOWS_CERTIFICATE_PATH: ${{ runner.temp }}\mdreader-release.pfx
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $storeName = $env:WINDOWS_CERT_STORE
          $storeOwned = $env:WINDOWS_CERT_STORE_OWNED
          $certificatePath = $env:WINDOWS_CERTIFICATE_PATH
          if ([string]::IsNullOrWhiteSpace($certificatePath)) {
            throw 'Windows signing certificate path is missing'
          }
          if (
            $env:GITHUB_RUN_ID -notmatch '^[0-9]+$' -or
            $env:GITHUB_RUN_ATTEMPT -notmatch '^[0-9]+$'
          ) {
            throw 'Windows release run identity is invalid'
          }
          $expectedStorePattern =
            "^MDReaderRelease-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-[0-9A-F]{32}$"
          try {
            if ([string]::IsNullOrWhiteSpace($storeName)) {
              if (-not [string]::IsNullOrWhiteSpace($storeOwned)) {
                throw 'Windows certificate-store ownership is present without a store capability'
              }
            } else {
              if ($storeName -notmatch $expectedStorePattern) {
                throw 'Windows certificate-store capability is invalid'
              }
              $storePath = "Cert:\LocalMachine\$storeName"
              if ([string]::IsNullOrWhiteSpace($storeOwned)) {
                if (Test-Path -LiteralPath $storePath) {
                  throw 'refusing to delete an unproven Windows certificate store'
                }
              } elseif ($storeOwned -eq 'true') {
                if (-not (Test-Path -LiteralPath $storePath)) {
                  throw 'owned Windows certificate store is missing'
                }
                $certificates = @(Get-ChildItem -LiteralPath $storePath -ErrorAction Stop)
                foreach ($certificate in $certificates) {
                  if ($certificate.Thumbprint -notmatch '^[0-9A-F]{40}$') {
                    throw 'Windows owned certificate identity is invalid'
                  }
                  $ownedCertificatePath = "$storePath\$($certificate.Thumbprint)"
                  $ownedCertificate = Get-Item -LiteralPath $ownedCertificatePath -ErrorAction Stop
                  if ($ownedCertificate.Thumbprint -ne $certificate.Thumbprint) {
                    throw 'Windows owned certificate identity mismatch'
                  }
                  Remove-Item `
                    -LiteralPath $ownedCertificatePath `
                    -DeleteKey `
                    -Force `
                    -ErrorAction Stop
                }
                if (@(Get-ChildItem -LiteralPath $storePath -ErrorAction Stop).Count -ne 0) {
                  throw 'Windows certificate residue remains in the owned store'
                }
                Remove-Item -LiteralPath $storePath -Force -ErrorAction Stop
                if (Test-Path -LiteralPath $storePath) {
                  throw 'Windows owned certificate-store residue remains after cleanup'
                }
              } else {
                throw 'Windows certificate-store ownership proof is invalid'
              }
            }
          } finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction Stop
            }
            if (Test-Path -LiteralPath $certificatePath) {
              throw 'Windows signing file residue remains after cleanup'
            }
          }
      - name: Seal only the credentialed bundle output and metadata
        id: seal-credentialed-output
        env:
          BUNDLE_WORKSPACE: ${{ steps.verify-credential-boundaries.outputs.bundle_workspace }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BUNDLES: ${{ matrix.bundles }}
          UPDATER_PUBLIC_KEY_SHA256: ${{ needs.prepare.outputs.updater_public_key_sha256 }}
          RELEASE_CONFIG_SHA256: ${{ steps.verify-credentialed-release-config.outputs.release_config_sha256 }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { execFileSync } = require('node:child_process');
          const {
            cpSync,
            lstatSync,
            mkdirSync,
            readFileSync,
            readdirSync,
            rmSync,
            writeFileSync,
          } = require('node:fs');
          const { join, relative, sep } = require('node:path');
          const hash = (body) => createHash('sha256').update(body).digest('hex');
          const sourceBundle = join(
            process.env.BUNDLE_WORKSPACE,
            'target',
            process.env.RELEASE_TARGET,
            'release',
            'bundle',
          );
          const output = join(process.env.RUNNER_TEMP, 'mdreader-credentialed-output');
          rmSync(output, { recursive: true, force: true });
          mkdirSync(output, { recursive: true, mode: 0o700 });
          cpSync(sourceBundle, join(output, 'bundle'), {
            recursive: true,
            dereference: false,
          });
          cpSync(
            join(process.env.RUNNER_TEMP, 'mdreader-release-config.json'),
            join(output, 'release-config.json'),
          );
          const files = [];
          const walk = (directory) => {
            for (const name of readdirSync(directory).sort()) {
              const path = join(directory, name);
              const relativePath = relative(output, path).split(sep).join('/');
              if (relativePath === 'credentialed-output.json') continue;
              const metadata = lstatSync(path);
              if (metadata.isDirectory()) {
                walk(path);
              } else if (metadata.isFile()) {
                const body = readFileSync(path);
                files.push({
                  path: relativePath,
                  kind: 'file',
                  mode: metadata.mode & 0o777,
                  bytes: body.byteLength,
                  sha256: hash(body),
                });
              } else if (metadata.isSymbolicLink()) {
                const target = Buffer.from(require('node:fs').readlinkSync(path), 'utf8');
                files.push({
                  path: relativePath,
                  kind: 'symlink',
                  mode: metadata.mode & 0o777,
                  bytes: target.byteLength,
                  sha256: hash(target),
                });
              } else {
                throw new Error(`credentialed output contains unsupported entry ${relativePath}`);
              }
            }
          };
          walk(output);
          if (!files.some((entry) => entry.path.startsWith('bundle/'))) {
            throw new Error('credentialed bundle output is empty');
          }
          const encoded = `${JSON.stringify({
            schemaVersion: 1,
            version: process.env.RELEASE_VERSION,
            sourceCommit: process.env.SOURCE_COMMIT,
            platform: process.env.RELEASE_PLATFORM,
            target: process.env.RELEASE_TARGET,
            bundles: process.env.RELEASE_BUNDLES,
            updaterPublicKeySha256: process.env.UPDATER_PUBLIC_KEY_SHA256,
            releaseConfigSha256: process.env.RELEASE_CONFIG_SHA256,
            files,
          }, null, 2)}\n`;
          writeFileSync(join(output, 'credentialed-output.json'), encoded, {
            mode: 0o600,
          });
          const archiveRoot = join(
            process.env.RUNNER_TEMP,
            'mdreader-credentialed-archive',
          );
          rmSync(archiveRoot, { recursive: true, force: true });
          mkdirSync(archiveRoot, { recursive: true, mode: 0o700 });
          const archivePath = join(archiveRoot, 'credentialed-output.tar');
          execFileSync('tar', ['-cf', archivePath, '-C', output, '.'], {
            stdio: 'pipe',
          });
          writeFileSync(
            process.env.GITHUB_OUTPUT,
            `archive_sha256=${hash(readFileSync(archivePath))}\n`,
            { flag: 'a' },
          );
          NODE
      - name: Hand off only the credentialed bundle output
        id: upload-credentialed-output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdreader-bundled-${{ matrix.platform }}-${{ steps.seal-credentialed-output.outputs.archive_sha256 }}
          path: ${{ runner.temp }}/mdreader-credentialed-archive
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [prepare, bundle-sign]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            target: universal-apple-darwin
            bundles: dmg
          - platform: windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the exact release verification source
        id: checkout-verify-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node 22
        id: setup-node-verify
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: pnpm
      - name: Enable pinned package manager
        id: enable-corepack-verify
        run: corepack enable
      - name: Install locked verification dependencies
        id: install-dependencies-verify
        run: pnpm install --frozen-lockfile
      - name: Download the credentialed platform output
        id: download-credentialed-output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mdreader-bundled-${{ matrix.platform }}-*
          path: ${{ runner.temp }}/mdreader-credentialed-download
          merge-multiple: false
      - name: Verify the closed credentialed output
        id: verify-credentialed-output
        run: scripts/release/verify-credentialed-output.sh "${{ matrix.platform }}" "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.source_commit }}" "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-credentialed-download" "$RUNNER_TEMP/mdreader-credentialed-output" "${{ needs.prepare.outputs.updater_public_key_sha256 }}"
      - name: Verify macOS Developer ID signature
        id: macos-verify-signature
        if: matrix.platform == 'macos'
        run: scripts/release/verify-macos-signature.sh "$RUNNER_TEMP/mdreader-credentialed-output/bundle"
      - name: Verify notarization and stapling
        id: macos-verify-notarization
        if: matrix.platform == 'macos'
        run: scripts/release/verify-macos-notarization.sh "$RUNNER_TEMP/mdreader-credentialed-output/bundle"
      - name: Verify Windows Authenticode signature
        id: windows-verify-signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: scripts/release/verify-windows-signature.ps1 -BundleRoot "$env:RUNNER_TEMP/mdreader-credentialed-output/bundle"
      - name: Verify Linux package matrix
        id: linux-verify-packages
        if: matrix.platform == 'linux'
        run: scripts/release/verify-linux-packages.sh "$RUNNER_TEMP/mdreader-credentialed-output/bundle" "$RUNNER_TEMP/mdreader-readelf.txt"
      - name: Install pinned Syft SBOM scanner
        id: install-syft
        uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b
        with:
          syft-version: v1.29.0
      - name: Stage immutable names and exact checksums
        id: stage-release
        env:
          SYFT_BIN: ${{ steps.install-syft.outputs.cmd }}
          MDREADER_UPDATER_PUBLIC_KEY: ${{ vars.MDREADER_UPDATER_PUBLIC_KEY }}
        run: scripts/release/stage-platform.sh "${{ matrix.platform }}" "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.source_commit }}" "${{ needs.prepare.outputs.published_at }}" "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-credentialed-output/release-config.json" "$RUNNER_TEMP/mdreader-credentialed-output/credentialed-output.json"
      - name: Inspect artifact-specific SPDX 2.3 SBOMs
        id: generate-sbom
        run: scripts/release/inspect-sboms.sh target/release-stage
      - name: Validate staged checksums and updater signatures
        id: validate-staged-release
        run: scripts/release/validate-staged-platform.sh "${{ matrix.platform }}" target/release-stage
      - name: Hand off only the verified platform release
        id: upload-staged-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdreader-release-${{ matrix.platform }}
          path: target/release-stage
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    outputs:
      publish_plan_sha256: ${{ steps.seal-publication.outputs.publish_plan_sha256 }}
    steps:
      - name: Checkout the exact release source
        id: checkout-aggregate-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node 22
        id: setup-node-aggregate
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: pnpm
      - name: Enable pinned package manager
        id: enable-corepack-aggregate
        run: corepack enable
      - name: Install locked workspace dependencies
        id: install-dependencies-aggregate
        run: pnpm install --frozen-lockfile
      - name: Download the verified macOS release
        id: download-staged-release-macos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-release-macos
          path: target/release-aggregate
      - name: Download the verified Windows release
        id: download-staged-release-windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-release-windows
          path: target/release-aggregate
      - name: Download the verified Linux release
        id: download-staged-release-linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-release-linux
          path: target/release-aggregate
      - name: Assemble the one immutable release manifest
        id: assemble-manifest
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ vars.MDREADER_UPDATER_PUBLIC_KEY }}
        run: |
          pnpm exec tsx scripts/release/release-cli.ts assemble \
            --root target/release-aggregate \
            --version "${{ needs.prepare.outputs.version }}" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}" \
            --published-at "${{ needs.prepare.outputs.published_at }}"
      - name: Reverify the aggregate before sealing publication
        id: validate-release
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ vars.MDREADER_UPDATER_PUBLIC_KEY }}
        run: |
          pnpm exec tsx scripts/release/release-cli.ts validate \
            --root target/release-aggregate \
            --manifest "target/release-aggregate/releases/v${{ needs.prepare.outputs.version }}/manifest.json" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}"
      - name: Seal the body-complete verified publication plan
        id: seal-publication
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ vars.MDREADER_UPDATER_PUBLIC_KEY }}
        run: |
          PLAN_SHA256="$(pnpm exec tsx scripts/release/release-cli.ts seal-publication \
            --root target/release-aggregate \
            --manifest "target/release-aggregate/releases/v${{ needs.prepare.outputs.version }}/manifest.json" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --output target/release-publish/sealed-publication-plan.json)"
          echo "publish_plan_sha256=$PLAN_SHA256" >> "$GITHUB_OUTPUT"
      - name: Bundle the no-child-process R2 publisher
        id: bundle-publisher
        run: scripts/release/build-sealed-publisher.sh target/release-publish/publish-sealed-plan.mjs
      - name: Match the publisher to the independently reviewed bundle
        id: verify-publisher-authority
        run: |
          [[ "${{ steps.bundle-publisher.outputs.publisher_sha256 }}" == "${{ needs.prepare.outputs.publisher_sha256 }}" ]] || {
            echo "publisher bundle differs from the independently authorized source build" >&2
            exit 1
          }
      - name: Hand off only the sealed plan and reviewed publisher
        id: upload-publish-plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdreader-sealed-publication-${{ needs.prepare.outputs.source_commit }}
          path: target/release-publish
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, aggregate]
    if: needs.prepare.outputs.publish_requested == 'true'
    environment: mdreader-production-publication
    runs-on: ubuntu-24.04
    steps:
      - name: Download the sealed verified publication capability
        id: download-publish-plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-sealed-publication-${{ needs.prepare.outputs.source_commit }}
          path: target/release-publish
      - name: Publish only the approved sealed plan
        id: publish-r2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MDREADER_R2_ACCESS_KEY_ID: ${{ secrets.MDREADER_R2_ACCESS_KEY_ID }}
          MDREADER_R2_SECRET_ACCESS_KEY: ${{ secrets.MDREADER_R2_SECRET_ACCESS_KEY }}
          RELEASE_BUCKET: ${{ vars.MDREADER_RELEASE_BUCKET }}
        run: exec node target/release-publish/publish-sealed-plan.mjs --plan target/release-publish/sealed-publication-plan.json --plan-sha256 "${{ needs.aggregate.outputs.publish_plan_sha256 }}" --publisher-sha256 "${{ needs.prepare.outputs.publisher_sha256 }}" --source-commit "${{ needs.prepare.outputs.source_commit }}" --version "${{ needs.prepare.outputs.version }}" --bucket "$RELEASE_BUCKET"
