name: mdreader-direct-release

on:
  push:
    tags:
      - 'mdreader-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Exact workspace semantic version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mdreader-stable-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      published_at: ${{ steps.metadata.outputs.published_at }}
      publish_requested: ${{ steps.metadata.outputs.publish_requested }}
      publisher_sha256: ${{ steps.authorize-publisher-bundle.outputs.publisher_sha256 }}
    steps:
      - name: Checkout the exact release source and main history
        id: checkout-release-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse an unapproved source revision
        id: authorize-release-source
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF" =~ ^refs/tags/mdreader-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "release tag is not an exact stable semantic version" >&2
              exit 1
            }
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
              echo "release tag source is not contained in origin/main" >&2
              exit 1
            }
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "manual release verification must run from main" >&2
              exit 1
            }
          else
            echo "unsupported release event $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
      - name: Install Node 22
        id: setup-node-prepare
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: pnpm
      - name: Enable pinned package manager
        id: enable-corepack-prepare
        run: corepack enable
      - name: Install locked workspace dependencies
        id: install-dependencies-prepare
        run: pnpm install --frozen-lockfile
      - name: Authorize the reviewed publisher bundle independently
        id: authorize-publisher-bundle
        run: scripts/release/build-sealed-publisher.sh "$RUNNER_TEMP/mdreader-authorized-publisher.mjs"
      - name: Pin version, source, time, and publication request
        id: metadata
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#mdreader-v}"
            PUBLISH_REQUESTED=true
          else
            VERSION="$DISPATCH_VERSION"
            PUBLISH_REQUESTED=false
          fi
          WORKSPACE_VERSION="$(pnpm exec tsx -e "import { readWorkspaceVersion } from './scripts/release/release-config.ts'; process.stdout.write(readWorkspaceVersion('./Cargo.toml'))")"
          [[ "$VERSION" == "$WORKSPACE_VERSION" ]] || {
            echo "release version does not match Cargo workspace version" >&2
            exit 1
          }
          {
            echo "version=$VERSION"
            echo "source_commit=$GITHUB_SHA"
            echo "published_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
            echo "publish_requested=$PUBLISH_REQUESTED"
          } >> "$GITHUB_OUTPUT"
      - name: Validate release workflow contract
        id: validate-workflow-contract
        run: pnpm exec tsx scripts/release/check-workflow.ts .github/workflows/release.yml

  build:
    needs: prepare
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            environment: mdreader-production-macos
            target: universal-apple-darwin
            bundles: dmg
          - platform: windows
            os: windows-2025
            environment: mdreader-production-windows
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux
            os: ubuntu-24.04
            environment: mdreader-production-linux
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the exact release source
        id: checkout-build-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node 22
        id: setup-node-build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: pnpm
      - name: Enable pinned package manager
        id: enable-corepack-build
        run: corepack enable
      - name: Install Linux packaging dependencies
        id: install-linux-packaging
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            rpm \
            libfuse2
      - name: Install locked workspace dependencies
        id: install-dependencies-build
        run: pnpm install --frozen-lockfile
      - name: Install Rust release targets
        id: install-rust-targets
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "${{ matrix.target }}"
          fi
      - name: Require macOS release credentials with shell builtins
        id: require-release-secrets-macos
        if: matrix.platform == 'macos'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.MDREADER_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MDREADER_APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MDREADER_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MDREADER_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MDREADER_APPLE_TEAM_ID }}
        run: scripts/release/require-release-secrets.sh macos
      - name: Require Windows release credentials with shell builtins
        id: require-release-secrets-windows
        if: matrix.platform == 'windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE_PASSWORD }}
        run: scripts/release/require-release-secrets.sh windows
      - name: Require Linux release credentials with shell builtins
        id: require-release-secrets-linux
        if: matrix.platform == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
        run: scripts/release/require-release-secrets.sh linux
      - name: Inspect Windows certificate thumbprint without persistence
        id: inspect-windows-cert
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE),
            $password,
            $flags
          )
          try {
            if (-not $certificate.HasPrivateKey) { throw "Windows signing certificate has no private key" }
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
            $certificate.Dispose()
          }
      - name: Generate validated macOS direct-release configuration
        id: generate-release-config-macos
        if: matrix.platform == 'macos'
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MDREADER_APPLE_SIGNING_IDENTITY }}
        run: scripts/release/generate-direct-release-config.sh macos "${{ needs.prepare.outputs.version }}" "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Generate validated Windows direct-release configuration
        id: generate-release-config-windows
        if: matrix.platform == 'windows'
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
          WINDOWS_CERT_THUMBPRINT: ${{ steps.inspect-windows-cert.outputs.thumbprint }}
        run: scripts/release/generate-direct-release-config.sh windows "${{ needs.prepare.outputs.version }}" "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Generate validated Linux direct-release configuration
        id: generate-release-config-linux
        if: matrix.platform == 'linux'
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
        run: scripts/release/generate-direct-release-config.sh linux "${{ needs.prepare.outputs.version }}" "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Build frontend and Rust binary without private credentials
        id: prepare-direct-release
        run: scripts/release/prepare-direct-release.sh "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-release-config.json" "$RUNNER_TEMP/mdreader-release-attestation.json"
      - name: Import macOS Developer ID certificate for bundling
        id: import-macos-cert
        if: matrix.platform == 'macos'
        env:
          APPLE_CERTIFICATE: ${{ secrets.MDREADER_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/mdreader-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mdreader-release.keychain-db"
          SEARCH_LIST_PATH="$RUNNER_TEMP/mdreader-keychain-search-list.txt"
          security list-keychains -d user |
            sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$SEARCH_LIST_PATH"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            [[ -n "$keychain" ]] && ORIGINAL_KEYCHAINS+=("$keychain")
          done < "$SEARCH_LIST_PATH"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
      - name: Import Windows Authenticode certificate for bundling
        id: import-windows-cert
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'mdreader-release.pfx'
          $storeName = "MDReaderRelease-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $storePath = "Cert:\CurrentUser\$storeName"
          if ($storeName -notmatch '^MDReaderRelease-[0-9]+-[0-9]+$') {
            throw "Windows per-run certificate store name is invalid"
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $collection = [Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
          try {
            $collection.Import($bytes, $password, $flags)
            $thumbprints = @($collection | ForEach-Object Thumbprint | Sort-Object -Unique)
            if ($thumbprints.Count -eq 0) { throw "Windows PFX contains no certificates" }
            $expectedThumbprint = "${{ steps.inspect-windows-cert.outputs.thumbprint }}"
            if ($thumbprints -notcontains $expectedThumbprint) { throw "Windows PFX does not contain the inspected signing certificate" }
            New-Item -Path Cert:\CurrentUser -Name $storeName -ErrorAction Stop | Out-Null
            "store_name=$storeName" >> $env:GITHUB_OUTPUT
            [IO.File]::WriteAllBytes($path, $bytes)
            $imported = @(Import-PfxCertificate -FilePath $path -Password $password -CertStoreLocation $storePath -ErrorAction Stop)
            $importedThumbprints = @($imported | ForEach-Object Thumbprint | Sort-Object -Unique)
            if (Compare-Object $thumbprints $importedThumbprints) { throw "Windows import did not persist the exact PFX certificate set" }
            $certificate = @($imported | Where-Object Thumbprint -eq $expectedThumbprint)
            if ($certificate.Count -ne 1) { throw "persisted Windows signing certificate does not match inspected thumbprint" }
            if (-not $certificate.HasPrivateKey) { throw "Windows signing certificate has no private key" }
          } finally {
            $collection | ForEach-Object Dispose
          }
      - name: Bundle, sign, and notarize macOS release
        id: bundle-direct-release-macos
        if: matrix.platform == 'macos'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.MDREADER_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MDREADER_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MDREADER_APPLE_TEAM_ID }}
        run: scripts/release/bundle-direct-release.sh "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Bundle and sign Windows release
        id: bundle-direct-release-windows
        if: matrix.platform == 'windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERT_STORE: ${{ steps.import-windows-cert.outputs.store_name }}
          WINDOWS_CERT_THUMBPRINT: ${{ steps.inspect-windows-cert.outputs.thumbprint }}
        run: scripts/release/bundle-direct-release.sh "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Bundle and sign Linux updater
        id: bundle-direct-release-linux
        if: matrix.platform == 'linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
        run: scripts/release/bundle-direct-release.sh "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Remove macOS signing material
        id: cleanup-macos-cert
        if: always() && matrix.platform == 'macos'
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/mdreader-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mdreader-release.keychain-db"
          SEARCH_LIST_PATH="$RUNNER_TEMP/mdreader-keychain-search-list.txt"
          RESTORED_LIST_PATH="$RUNNER_TEMP/mdreader-keychain-search-list-restored.txt"
          CLEANUP_FAILED=0
          if [[ -f "$SEARCH_LIST_PATH" ]]; then
            ORIGINAL_KEYCHAINS=()
            while IFS= read -r keychain; do
              [[ -n "$keychain" ]] && ORIGINAL_KEYCHAINS+=("$keychain")
            done < "$SEARCH_LIST_PATH"
            security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" || CLEANUP_FAILED=1
            security list-keychains -d user |
              sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' > "$RESTORED_LIST_PATH" || CLEANUP_FAILED=1
            if ! cmp -s "$SEARCH_LIST_PATH" "$RESTORED_LIST_PATH"; then
              echo "macOS keychain search list restore residue remains" >&2
              CLEANUP_FAILED=1
            fi
          fi
          if [[ -e "$KEYCHAIN_PATH" ]] && ! security delete-keychain "$KEYCHAIN_PATH"; then
            CLEANUP_FAILED=1
          fi
          if [[ -e "$KEYCHAIN_PATH" ]]; then
            echo "macOS signing keychain residue remains" >&2
            CLEANUP_FAILED=1
          fi
          rm -f "$CERTIFICATE_PATH" "$SEARCH_LIST_PATH" "$RESTORED_LIST_PATH" || CLEANUP_FAILED=1
          for path in "$CERTIFICATE_PATH" "$SEARCH_LIST_PATH" "$RESTORED_LIST_PATH"; do
            if [[ -e "$path" ]]; then
              echo "macOS signing file residue remains at $path" >&2
              CLEANUP_FAILED=1
            fi
          done
          [[ "$CLEANUP_FAILED" -eq 0 ]]
      - name: Remove Windows signing material
        id: cleanup-windows-cert
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'mdreader-release.pfx'
          $expectedStoreName = "MDReaderRelease-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $ownedStoreName = "${{ steps.import-windows-cert.outputs.store_name }}"
          if (-not [string]::IsNullOrWhiteSpace($ownedStoreName) -and $ownedStoreName -ne $expectedStoreName) {
            throw "Windows per-run certificate store ownership mismatch"
          }
          if ($expectedStoreName -notmatch '^MDReaderRelease-[0-9]+-[0-9]+$') {
            throw "Windows per-run certificate store identity is invalid"
          }
          $storePath = "Cert:\CurrentUser\$expectedStoreName"
          if (Test-Path -LiteralPath $storePath) {
            $certificates = @(Get-ChildItem -LiteralPath $storePath -ErrorAction Stop)
            foreach ($certificate in $certificates) {
              $certificatePath = Join-Path $storePath $certificate.Thumbprint
              $ownedCertificate = Get-Item -LiteralPath $certificatePath -ErrorAction Stop
              if ($ownedCertificate.Thumbprint -ne $certificate.Thumbprint) {
                throw "Windows per-run certificate store identity mismatch"
              }
              Remove-Item -LiteralPath $certificatePath -DeleteKey -Force -ErrorAction Stop
            }
            if (@(Get-ChildItem -LiteralPath $storePath -ErrorAction Stop).Count -ne 0) {
              throw "Windows certificate residue remains in the per-run store"
            }
            Remove-Item -LiteralPath $storePath -Force -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $storePath) {
            throw "Windows per-run certificate store residue remains after cleanup"
          }
          if (Test-Path $path) { Remove-Item $path -Force -ErrorAction Stop }
          if (Test-Path $path) {
            throw "Windows signing file residue remains after cleanup"
          }
      - name: Verify attestation and seal bundle without credentials
        id: verify-direct-release
        run: scripts/release/verify-direct-release.sh "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-release-config.json" "$RUNNER_TEMP/mdreader-release-attestation.json" "$RUNNER_TEMP/mdreader-release-bundle-seal.json"
      - name: Verify macOS Developer ID signature
        id: macos-verify-signature
        if: matrix.platform == 'macos'
        run: scripts/release/verify-macos-signature.sh "target/${{ matrix.target }}/release/bundle"
      - name: Verify notarization and stapling
        id: macos-verify-notarization
        if: matrix.platform == 'macos'
        run: scripts/release/verify-macos-notarization.sh "target/${{ matrix.target }}/release/bundle"
      - name: Verify Windows Authenticode signature
        id: windows-verify-signature
        if: matrix.platform == 'windows'
        shell: pwsh
        run: scripts/release/verify-windows-signature.ps1 -BundleRoot "target/${{ matrix.target }}/release/bundle"
      - name: Verify Linux package matrix
        id: linux-verify-packages
        if: matrix.platform == 'linux'
        run: scripts/release/verify-linux-packages.sh "target/${{ matrix.target }}/release/bundle" "$RUNNER_TEMP/mdreader-readelf.txt"
      - name: Install pinned Syft SBOM scanner
        id: install-syft
        uses: anchore/sbom-action/download-syft@f8bdd1d8ac5e901a77a92f111440fdb1b593736b
        with:
          syft-version: v1.29.0
      - name: Stage immutable names and exact checksums
        id: stage-release
        env:
          SYFT_BIN: ${{ steps.install-syft.outputs.cmd }}
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
        run: scripts/release/stage-platform.sh "${{ matrix.platform }}" "${{ needs.prepare.outputs.version }}" "${{ needs.prepare.outputs.source_commit }}" "${{ needs.prepare.outputs.published_at }}" "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-release-config.json" "$RUNNER_TEMP/mdreader-release-attestation.json" "$RUNNER_TEMP/mdreader-release-bundle-seal.json"
      - name: Inspect artifact-specific SPDX 2.3 SBOMs
        id: generate-sbom
        run: scripts/release/inspect-sboms.sh target/release-stage
      - name: Validate staged checksums and updater signatures
        id: validate-staged-release
        run: scripts/release/validate-staged-platform.sh "${{ matrix.platform }}" target/release-stage
      - name: Hand off only the verified platform release
        id: upload-staged-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdreader-release-${{ matrix.platform }}
          path: target/release-stage
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    outputs:
      publish_plan_sha256: ${{ steps.seal-publication.outputs.publish_plan_sha256 }}
    steps:
      - name: Checkout the exact release source
        id: checkout-aggregate-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node 22
        id: setup-node-aggregate
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: pnpm
      - name: Enable pinned package manager
        id: enable-corepack-aggregate
        run: corepack enable
      - name: Install locked workspace dependencies
        id: install-dependencies-aggregate
        run: pnpm install --frozen-lockfile
      - name: Download the verified macOS release
        id: download-staged-release-macos
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-release-macos
          path: target/release-aggregate
      - name: Download the verified Windows release
        id: download-staged-release-windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-release-windows
          path: target/release-aggregate
      - name: Download the verified Linux release
        id: download-staged-release-linux
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-release-linux
          path: target/release-aggregate
      - name: Assemble the one immutable release manifest
        id: assemble-manifest
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
        run: |
          pnpm exec tsx scripts/release/release-cli.ts assemble \
            --root target/release-aggregate \
            --version "${{ needs.prepare.outputs.version }}" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}" \
            --published-at "${{ needs.prepare.outputs.published_at }}"
      - name: Reverify the aggregate before sealing publication
        id: validate-release
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
        run: |
          pnpm exec tsx scripts/release/release-cli.ts validate \
            --root target/release-aggregate \
            --manifest "target/release-aggregate/releases/v${{ needs.prepare.outputs.version }}/manifest.json" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}"
      - name: Seal the body-complete verified publication plan
        id: seal-publication
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ secrets.MDREADER_UPDATER_PUBLIC_KEY }}
        run: |
          PLAN_SHA256="$(pnpm exec tsx scripts/release/release-cli.ts seal-publication \
            --root target/release-aggregate \
            --manifest "target/release-aggregate/releases/v${{ needs.prepare.outputs.version }}/manifest.json" \
            --source-commit "${{ needs.prepare.outputs.source_commit }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --output target/release-publish/sealed-publication-plan.json)"
          echo "publish_plan_sha256=$PLAN_SHA256" >> "$GITHUB_OUTPUT"
      - name: Bundle the no-child-process R2 publisher
        id: bundle-publisher
        run: scripts/release/build-sealed-publisher.sh target/release-publish/publish-sealed-plan.mjs
      - name: Match the publisher to the independently reviewed bundle
        id: verify-publisher-authority
        run: |
          [[ "${{ steps.bundle-publisher.outputs.publisher_sha256 }}" == "${{ needs.prepare.outputs.publisher_sha256 }}" ]] || {
            echo "publisher bundle differs from the independently authorized source build" >&2
            exit 1
          }
      - name: Hand off only the sealed plan and reviewed publisher
        id: upload-publish-plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdreader-sealed-publication-${{ needs.prepare.outputs.source_commit }}
          path: target/release-publish
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, aggregate]
    if: needs.prepare.outputs.publish_requested == 'true'
    environment: mdreader-production-publication
    runs-on: ubuntu-24.04
    steps:
      - name: Download the sealed verified publication capability
        id: download-publish-plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-sealed-publication-${{ needs.prepare.outputs.source_commit }}
          path: target/release-publish
      - name: Publish only the approved sealed plan
        id: publish-r2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MDREADER_R2_ACCESS_KEY_ID: ${{ secrets.MDREADER_R2_ACCESS_KEY_ID }}
          MDREADER_R2_SECRET_ACCESS_KEY: ${{ secrets.MDREADER_R2_SECRET_ACCESS_KEY }}
          RELEASE_BUCKET: ${{ vars.MDREADER_RELEASE_BUCKET }}
        run: exec node target/release-publish/publish-sealed-plan.mjs --plan target/release-publish/sealed-publication-plan.json --plan-sha256 "${{ needs.aggregate.outputs.publish_plan_sha256 }}" --publisher-sha256 "${{ needs.prepare.outputs.publisher_sha256 }}" --source-commit "${{ needs.prepare.outputs.source_commit }}" --version "${{ needs.prepare.outputs.version }}" --bucket "$RELEASE_BUCKET"
