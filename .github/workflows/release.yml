      - name: Inspect Windows certificate thumbprint without persistence
        id: inspect-windows-cert
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE),
            $password,
            $flags
          )
          try {
            if (-not $certificate.HasPrivateKey) { throw "Windows signing certificate has no private key" }
            "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
          } finally {
            $certificate.Dispose()
          }
      - name: Generate credentialed macOS bundle configuration inline
