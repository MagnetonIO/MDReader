name: mdreader-direct-release

# Trust roots: this workflow, the full-SHA actions and GitHub artifact service,
# and the exact SRI-pinned Tauri npm tarballs. The protected bundle job
# inventories the downloaded Node/Tauri runtime and both handoffs.
# OS/tool trust boundary: GitHub runner-image native packaging
# tools (security, codesign, PowerShell, signtool, NSIS, dpkg/rpm/AppImage
# tooling, tar, and the platform linker) remain outside the byte inventory and
# are trusted as root-owned components of the pinned runner image.

on:
  push:
    tags:
      - 'mdreader-v*'
  workflow_dispatch:
    inputs:
      version:
        description: Exact workspace semantic version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mdreader-stable-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      published_at: ${{ steps.metadata.outputs.published_at }}
      publish_requested: ${{ steps.metadata.outputs.publish_requested }}
      publisher_sha256: ${{ steps.authorize-publisher-bundle.outputs.publisher_sha256 }}
      support_sha256: ${{ steps.seal-release-support.outputs.support_sha256 }}
      updater_public_key_sha256: ${{ steps.seal-release-support.outputs.updater_public_key_sha256 }}
    steps:
      - name: Checkout the exact release source and main history
        id: checkout-release-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse an unapproved source revision
        id: authorize-release-source
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            [[ "$GITHUB_REF" =~ ^refs/tags/mdreader-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
              echo "release tag is not an exact stable semantic version" >&2
              exit 1
            }
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
              echo "release tag source is not contained in origin/main" >&2
              exit 1
            }
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
              echo "manual release verification must run from main" >&2
              exit 1
            }
          else
            echo "unsupported release event $GITHUB_EVENT_NAME" >&2
            exit 1
          fi
      - name: Seal reviewed packaging support before package code runs
        id: seal-release-support
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ vars.MDREADER_UPDATER_PUBLIC_KEY }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const {
            chmodSync,
            copyFileSync,
            lstatSync,
            mkdirSync,
            readFileSync,
            rmSync,
            writeFileSync,
          } = require('node:fs');
          const { basename, join } = require('node:path');
          const hash = (body) => createHash('sha256').update(body).digest('hex');
          const key = process.env.MDREADER_UPDATER_PUBLIC_KEY;
          if (
            typeof key !== 'string' ||
            key.length < 64 ||
            key.length % 4 !== 0 ||
            !/^[A-Za-z0-9+/]+={0,2}$/.test(key)
          ) {
            throw new Error('public updater key variable is missing or invalid');
          }
          const root = join(process.env.RUNNER_TEMP, 'mdreader-release-support');
          const payload = join(root, 'payload');
          rmSync(root, { recursive: true, force: true });
          mkdirSync(payload, { recursive: true, mode: 0o700 });
          const files = [];
          for (const source of [
            'scripts/release/sign-windows-from-store.ps1',
            'scripts/release/windows-minimum.nsh',
          ]) {
            const metadata = lstatSync(source);
            if (!metadata.isFile() || metadata.isSymbolicLink()) {
              throw new Error(`reviewed release support is not a regular file: ${source}`);
            }
            const destination = join(payload, basename(source));
            copyFileSync(source, destination);
            chmodSync(destination, metadata.mode & 0o777);
            const body = readFileSync(destination);
            files.push({
              path: basename(source),
              bytes: body.byteLength,
              sha256: hash(body),
            });
          }
          files.sort((left, right) => left.path.localeCompare(right.path));
          const encoded = `${JSON.stringify({
            schemaVersion: 1,
            sourceCommit: process.env.GITHUB_SHA,
            files,
          }, null, 2)}\n`;
          writeFileSync(join(root, 'support.json'), encoded, { mode: 0o600 });
          writeFileSync(
            process.env.GITHUB_OUTPUT,
            `support_sha256=${hash(encoded)}\nupdater_public_key_sha256=${hash(Buffer.from(key, 'utf8'))}\n`,
            { flag: 'a' },
          );
          NODE
      - name: Hand off hash-addressed reviewed packaging support
        id: upload-release-support
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdreader-release-support-${{ steps.seal-release-support.outputs.support_sha256 }}
          path: ${{ runner.temp }}/mdreader-release-support
          if-no-files-found: error
          retention-days: 1
      - name: Install Node 22
        id: setup-node-prepare
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: pnpm
      - name: Enable pinned package manager
        id: enable-corepack-prepare
        run: corepack enable
      - name: Install locked workspace dependencies
        id: install-dependencies-prepare
        run: pnpm install --frozen-lockfile
      - name: Authorize the reviewed publisher bundle independently
        id: authorize-publisher-bundle
        run: scripts/release/build-sealed-publisher.sh "$RUNNER_TEMP/mdreader-authorized-publisher.mjs"
      - name: Pin version, source, time, and publication request
        id: metadata
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#mdreader-v}"
            PUBLISH_REQUESTED=true
          else
            VERSION="$DISPATCH_VERSION"
            PUBLISH_REQUESTED=false
          fi
          WORKSPACE_VERSION="$(pnpm exec tsx -e "import { readWorkspaceVersion } from './scripts/release/release-config.ts'; process.stdout.write(readWorkspaceVersion('./Cargo.toml'))")"
          [[ "$VERSION" == "$WORKSPACE_VERSION" ]] || {
            echo "release version does not match Cargo workspace version" >&2
            exit 1
          }
          {
            echo "version=$VERSION"
            echo "source_commit=$GITHUB_SHA"
            echo "published_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
            echo "publish_requested=$PUBLISH_REQUESTED"
          } >> "$GITHUB_OUTPUT"
      - name: Validate release workflow contract
        id: validate-workflow-contract
        run: pnpm exec tsx scripts/release/check-workflow.ts .github/workflows/release.yml

  build-unsigned:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            target: universal-apple-darwin
            bundles: dmg
            binary: mdreader-app
          - platform: windows
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
            binary: mdreader-app.exe
          - platform: linux
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            binary: mdreader-app
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the exact release source
        id: checkout-build-source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Node 22
        id: setup-node-build
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
          cache: pnpm
      - name: Enable pinned package manager
        id: enable-corepack-build
        run: corepack enable
      - name: Install Linux compilation dependencies
        id: install-linux-compilation
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential
      - name: Install locked workspace dependencies
        id: install-dependencies-build
        run: pnpm install --frozen-lockfile
      - name: Install Rust release targets
        id: install-rust-targets
        run: |
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add "${{ matrix.target }}"
          fi
      - name: Generate unsigned direct-updater build configuration
        id: generate-unsigned-release-config
        env:
          MDREADER_UPDATER_PUBLIC_KEY: ${{ vars.MDREADER_UPDATER_PUBLIC_KEY }}
          EXPECTED_UPDATER_PUBLIC_KEY_SHA256: ${{ needs.prepare.outputs.updater_public_key_sha256 }}
        run: |
          ACTUAL_KEY_SHA256="$(node -e 'const { createHash } = require("node:crypto"); process.stdout.write(createHash("sha256").update(process.env.MDREADER_UPDATER_PUBLIC_KEY || "", "utf8").digest("hex"))')"
          [[ "$ACTUAL_KEY_SHA256" == "$EXPECTED_UPDATER_PUBLIC_KEY_SHA256" ]] || {
            echo "public updater key differs from the pre-build authority" >&2
            exit 1
          }
          scripts/release/generate-direct-release-config.sh linux "${{ needs.prepare.outputs.version }}" "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Attest immutable compile inputs before application build
        id: attest-unsigned-build
        env:
          EXPECTED_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_RELEASE_TARGET: ${{ matrix.target }}
          EXPECTED_RELEASE_BUNDLES: ${{ matrix.bundles }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, writeFileSync } = require('node:fs');
          const hash = (body) => createHash('sha256').update(body).digest('hex');
          const configPath = `${process.env.RUNNER_TEMP}/mdreader-release-config.json`;
          const configBytes = readFileSync(configPath);
          const config = JSON.parse(configBytes.toString('utf8'));
          const encoded = `${JSON.stringify({
            schemaVersion: 2,
            version: process.env.EXPECTED_RELEASE_VERSION,
            target: process.env.EXPECTED_RELEASE_TARGET,
            bundles: process.env.EXPECTED_RELEASE_BUNDLES,
            releaseConfigSha256: hash(configBytes),
            updaterPublicKeySha256: hash(
              Buffer.from(config.plugins.updater.pubkey, 'utf8'),
            ),
          }, null, 2)}\n`;
          writeFileSync(
            `${process.env.RUNNER_TEMP}/mdreader-release-attestation.json`,
            encoded,
            { mode: 0o600 },
          );
          writeFileSync(
            process.env.GITHUB_OUTPUT,
            `attestation_sha256=${hash(encoded)}\n`,
            { flag: 'a' },
          );
          NODE
      - name: Build frontend and Rust binary without private credentials
        id: prepare-direct-release
        run: scripts/release/prepare-direct-release.sh "${{ matrix.target }}" "${{ matrix.bundles }}" "$RUNNER_TEMP/mdreader-release-config.json"
      - name: Verify immutable compile inputs after application build
        id: verify-unsigned-build
        shell: bash
        env:
          EXPECTED_BUILD_ATTESTATION_SHA256: ${{ steps.attest-unsigned-build.outputs.attestation_sha256 }}
          RELEASE_CONFIG_PATH: ${{ runner.temp }}/mdreader-release-config.json
          BUILD_ATTESTATION_PATH: ${{ runner.temp }}/mdreader-release-attestation.json
          EXPECTED_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_RELEASE_TARGET: ${{ matrix.target }}
          EXPECTED_RELEASE_BUNDLES: ${{ matrix.bundles }}
          EXPECTED_RELEASE_PLATFORM: ${{ matrix.platform }}
          EXPECTED_UPDATER_PUBLIC_KEY_SHA256: ${{ needs.prepare.outputs.updater_public_key_sha256 }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const hash = (body) => createHash('sha256').update(body).digest('hex');
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`unsigned build verifier is missing ${name}`);
            return value;
          };
          const tuples = {
            macos: ['universal-apple-darwin', 'dmg'],
            windows: ['x86_64-pc-windows-msvc', 'nsis'],
            linux: ['x86_64-unknown-linux-gnu', 'appimage,deb,rpm'],
          };
          const platform = required('EXPECTED_RELEASE_PLATFORM');
          const target = required('EXPECTED_RELEASE_TARGET');
          const bundles = required('EXPECTED_RELEASE_BUNDLES');
          const tuple = tuples[platform];
          if (!tuple || tuple[0] !== target || tuple[1] !== bundles) {
            throw new Error('unsigned build platform, target, and bundle tuple is invalid');
          }
          const attestationBytes = readFileSync(required('BUILD_ATTESTATION_PATH'));
          if (hash(attestationBytes) !== required('EXPECTED_BUILD_ATTESTATION_SHA256')) {
            throw new Error('unsigned build attestation changed after its pre-build boundary');
          }
          const attestation = JSON.parse(attestationBytes.toString('utf8'));
          const configBytes = readFileSync(required('RELEASE_CONFIG_PATH'));
          const config = JSON.parse(configBytes.toString('utf8'));
          if (
            attestation.schemaVersion !== 2 ||
            attestation.version !== required('EXPECTED_RELEASE_VERSION') ||
            attestation.target !== target ||
            attestation.bundles !== bundles ||
            attestation.releaseConfigSha256 !== hash(configBytes) ||
            attestation.updaterPublicKeySha256 !==
              required('EXPECTED_UPDATER_PUBLIC_KEY_SHA256') ||
            config.identifier !== 'dev.mdreader.app' ||
            config.version !== attestation.version ||
            config.build?.beforeBuildCommand !== '' ||
            config.bundle?.createUpdaterArtifacts !== true ||
            config.bundle?.windows !== undefined ||
            config.bundle?.macOS !== undefined ||
            config.plugins?.updater?.endpoints?.length !== 1 ||
            config.plugins.updater.endpoints[0] !==
              'https://downloads.mdreader.dev/channels/stable/updater.json' ||
            hash(Buffer.from(config.plugins.updater.pubkey, 'utf8')) !==
              attestation.updaterPublicKeySha256
          ) {
            throw new Error('unsigned build inputs do not match the immutable compile attestation');
          }
          NODE
      - name: Seal the closed unsigned binary and resource handoff
        id: seal-unsigned-handoff
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_BUNDLES: ${{ matrix.bundles }}
          RELEASE_BINARY: ${{ matrix.binary }}
          UPDATER_PUBLIC_KEY_SHA256: ${{ needs.prepare.outputs.updater_public_key_sha256 }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const {
            chmodSync,
            copyFileSync,
            lstatSync,
            mkdirSync,
            readFileSync,
            rmSync,
            writeFileSync,
          } = require('node:fs');
          const { dirname, join, relative, sep } = require('node:path');
          const hash = (body) => createHash('sha256').update(body).digest('hex');
          const root = join(process.cwd(), 'target', 'release-unsigned');
          const payload = join(root, 'payload');
          rmSync(root, { recursive: true, force: true });
          mkdirSync(payload, { recursive: true, mode: 0o700 });
          const sources = [
            [
              join('target', process.env.RELEASE_TARGET, 'release', process.env.RELEASE_BINARY),
              join('target', process.env.RELEASE_TARGET, 'release', process.env.RELEASE_BINARY),
            ],
            ...[
              '32x32.png',
              '128x128.png',
              '128x128@2x.png',
              'icon.icns',
              'icon.ico',
            ].map((icon) => [
              join('apps', 'mdreader', 'src-tauri', 'icons', icon),
              join('icons', icon),
            ]),
          ];
          const files = [];
          for (const [source, relativePath] of sources) {
            const metadata = lstatSync(source);
            if (!metadata.isFile() || metadata.isSymbolicLink() || metadata.size === 0) {
              throw new Error(`unsigned handoff source is not a non-empty regular file: ${source}`);
            }
            const destination = join(payload, relativePath);
            mkdirSync(dirname(destination), { recursive: true, mode: 0o700 });
            copyFileSync(source, destination);
            chmodSync(destination, metadata.mode & 0o777);
            const body = readFileSync(destination);
            files.push({
              path: relative(payload, destination).split(sep).join('/'),
              bytes: body.byteLength,
              sha256: hash(body),
            });
          }
          files.sort((left, right) => left.path.localeCompare(right.path));
          const encoded = `${JSON.stringify({
            schemaVersion: 1,
            version: process.env.RELEASE_VERSION,
            sourceCommit: process.env.SOURCE_COMMIT,
            platform: process.env.RELEASE_PLATFORM,
            target: process.env.RELEASE_TARGET,
            bundles: process.env.RELEASE_BUNDLES,
            updaterPublicKeySha256: process.env.UPDATER_PUBLIC_KEY_SHA256,
            files,
          }, null, 2)}\n`;
          writeFileSync(join(root, 'handoff.json'), encoded, { mode: 0o600 });
          writeFileSync(
            process.env.GITHUB_OUTPUT,
            `handoff_sha256=${hash(encoded)}\n`,
            { flag: 'a' },
          );
          NODE
      - name: Hand off only the hash-addressed unsigned binary and resources
        id: upload-unsigned-handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mdreader-unsigned-${{ matrix.platform }}-${{ steps.seal-unsigned-handoff.outputs.handoff_sha256 }}
          path: target/release-unsigned
          if-no-files-found: error
          retention-days: 1

  bundle-sign:
    needs: [prepare, build-unsigned]
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
            environment: mdreader-production-macos
            target: universal-apple-darwin
            bundles: dmg
            binary: mdreader-app
            native_package: '@tauri-apps/cli-darwin-x64'
            native_integrity: 'sha512-uFsGQAAfuyz1k/yGLmkWfkBlgKAqZfxqlHmLWx81QU27RJWfmbNHCIq8T8w1e+VClleIuZUjpHWfoE4E3DLo3A=='
          - platform: windows
            os: windows-2025
            environment: mdreader-production-windows
            target: x86_64-pc-windows-msvc
            bundles: nsis
            binary: mdreader-app.exe
            native_package: '@tauri-apps/cli-win32-x64-msvc'
            native_integrity: 'sha512-+vDiqBIU5dMISg/wNvX3sF+ZHfgJGJ5T0AcO+EHNXV9GGAG+P5fzodlDXD3QdKCRgZxMoCm5PPvj3BqLNjBthw=='
          - platform: linux
            os: ubuntu-24.04
            environment: mdreader-production-linux
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
            binary: mdreader-app
            native_package: '@tauri-apps/cli-linux-x64-gnu'
            native_integrity: 'sha512-2VRNWl84FOH0m2giiDkO2h0QXlcMJeX+zJDpI5kDIQAx6s+geF3v48F4DXfJez4GS/FdoDGnPnw1C2iYGbQ7bQ=='
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install pinned Node runtime
        id: setup-node-bundle
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.13.1'
      - name: Download the one hash-addressed unsigned handoff
        id: download-unsigned-handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mdreader-unsigned-${{ matrix.platform }}-*
          path: ${{ runner.temp }}/mdreader-unsigned-download
          merge-multiple: false
      - name: Download independently sealed packaging support
        id: download-release-support
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mdreader-release-support-${{ needs.prepare.outputs.support_sha256 }}
          path: ${{ runner.temp }}/mdreader-support-download/mdreader-release-support-${{ needs.prepare.outputs.support_sha256 }}
      - name: Establish isolated SRI-pinned Tauri CLI and native runtime
        id: establish-tauri-runtime
        run: |
          PACKAGE_ROOT="$RUNNER_TEMP/mdreader-tauri-packages"
          RUNTIME_ROOT="$RUNNER_TEMP/mdreader-tauri-runtime"
          rm -rf "$PACKAGE_ROOT" "$RUNTIME_ROOT"
          mkdir -p "$PACKAGE_ROOT/cli" "$PACKAGE_ROOT/native" "$RUNTIME_ROOT/node_modules/@tauri-apps"
          (
            cd "$PACKAGE_ROOT/cli"
            npm pack --ignore-scripts --json '@tauri-apps/cli@2.11.4' > pack.json
          )
          (
            cd "$PACKAGE_ROOT/native"
            npm pack --ignore-scripts --json "$TAURI_NATIVE_PACKAGE@2.11.4" > pack.json
          )
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { join } = require('node:path');
          for (const [directory, expected] of [
            ['cli', process.env.TAURI_CLI_INTEGRITY],
            ['native', process.env.TAURI_NATIVE_INTEGRITY],
          ]) {
            const rows = JSON.parse(
              readFileSync(
                join(process.env.RUNNER_TEMP, 'mdreader-tauri-packages', directory, 'pack.json'),
                'utf8',
              ),
            );
            if (
              !Array.isArray(rows) ||
              rows.length !== 1 ||
              rows[0].integrity !== expected ||
              typeof rows[0].filename !== 'string'
            ) {
              throw new Error(`Tauri ${directory} tarball does not match its pinned SRI`);
            }
          }
          NODE
          CLI_TARBALL="$(node -e 'const { readFileSync } = require("node:fs"); process.stdout.write(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename)' "$PACKAGE_ROOT/cli/pack.json")"
          NATIVE_TARBALL="$(node -e 'const { readFileSync } = require("node:fs"); process.stdout.write(JSON.parse(readFileSync(process.argv[1], "utf8"))[0].filename)' "$PACKAGE_ROOT/native/pack.json")"
          mkdir -p "$PACKAGE_ROOT/cli-extract" "$PACKAGE_ROOT/native-extract"
          tar -xzf "$PACKAGE_ROOT/cli/$CLI_TARBALL" -C "$PACKAGE_ROOT/cli-extract"
          tar -xzf "$PACKAGE_ROOT/native/$NATIVE_TARBALL" -C "$PACKAGE_ROOT/native-extract"
          mv "$PACKAGE_ROOT/cli-extract/package" "$RUNTIME_ROOT/node_modules/@tauri-apps/cli"
          NATIVE_DIRECTORY="${TAURI_NATIVE_PACKAGE#@tauri-apps/}"
          mv "$PACKAGE_ROOT/native-extract/package" "$RUNTIME_ROOT/node_modules/@tauri-apps/$NATIVE_DIRECTORY"
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const {
            lstatSync,
            readFileSync,
            readdirSync,
            writeFileSync,
          } = require('node:fs');
          const { join, relative, sep } = require('node:path');
          const hash = (body) => createHash('sha256').update(body).digest('hex');
          const root = join(process.env.RUNNER_TEMP, 'mdreader-tauri-runtime');
          const files = [];
          const walk = (directory) => {
            for (const name of readdirSync(directory).sort()) {
              const path = join(directory, name);
              const metadata = lstatSync(path);
              if (metadata.isSymbolicLink()) {
                throw new Error(`isolated Tauri runtime contains a symbolic link: ${path}`);
              }
              if (metadata.isDirectory()) {
                walk(path);
              } else if (metadata.isFile()) {
                const body = readFileSync(path);
                files.push({
                  path: relative(root, path).split(sep).join('/'),
                  mode: metadata.mode & 0o777,
                  bytes: body.byteLength,
                  sha256: hash(body),
                });
              } else {
                throw new Error(`isolated Tauri runtime contains a non-regular entry: ${path}`);
              }
            }
          };
          walk(root);
          const nativeDirectory = process.env.TAURI_NATIVE_PACKAGE.slice('@tauri-apps/'.length);
          const cli = JSON.parse(
            readFileSync(join(root, 'node_modules', '@tauri-apps', 'cli', 'package.json'), 'utf8'),
          );
          const native = JSON.parse(
            readFileSync(join(root, 'node_modules', '@tauri-apps', nativeDirectory, 'package.json'), 'utf8'),
          );
          const nativeFiles = files.filter(
            (entry) =>
              entry.path.startsWith(`node_modules/@tauri-apps/${nativeDirectory}/`) &&
              entry.path.endsWith('.node'),
          );
          if (
            cli.name !== '@tauri-apps/cli' ||
            cli.version !== '2.11.4' ||
            native.name !== process.env.TAURI_NATIVE_PACKAGE ||
            native.version !== '2.11.4' ||
            nativeFiles.length !== 1 ||
            !files.some((entry) => entry.path === 'node_modules/@tauri-apps/cli/tauri.js') ||
            !files.some((entry) => entry.path === 'node_modules/@tauri-apps/cli/main.js') ||
            !files.some((entry) => entry.path === 'node_modules/@tauri-apps/cli/index.js')
          ) {
            throw new Error('isolated Tauri runtime package shape is invalid');
          }
          const nodePath = process.execPath;
          const nodeMetadata = lstatSync(nodePath);
          if (!nodeMetadata.isFile() || nodeMetadata.isSymbolicLink()) {
            throw new Error('Node runtime is not an exact regular executable');
          }
          const nodeBody = readFileSync(nodePath);
          const encoded = `${JSON.stringify({
            schemaVersion: 1,
            platform: process.env.RELEASE_PLATFORM,
            cliVersion: '2.11.4',
            cliPackage: '@tauri-apps/cli',
            cliIntegrity: process.env.TAURI_CLI_INTEGRITY,
            nativePackage: process.env.TAURI_NATIVE_PACKAGE,
            nativeIntegrity: process.env.TAURI_NATIVE_INTEGRITY,
            node: {
              path: nodePath,
              mode: nodeMetadata.mode & 0o777,
              bytes: nodeBody.byteLength,
              sha256: hash(nodeBody),
            },
            files,
          }, null, 2)}\n`;
          writeFileSync(join(root, 'runtime.json'), encoded, { mode: 0o600 });
          writeFileSync(
            process.env.GITHUB_OUTPUT,
            `runtime_manifest_sha256=${hash(encoded)}\n`,
            { flag: 'a' },
          );
          NODE
        env:
          TAURI_CLI_INTEGRITY: 'sha512-R8xGtMpwyetawSqm9kYOuMmEqkhUbvcUy8n0aNXIxollKBLESUu5f4Fx+64hgASYm1H+jSWq6jCW6zqTnH6hqQ=='
          TAURI_NATIVE_PACKAGE: ${{ matrix.native_package }}
          TAURI_NATIVE_INTEGRITY: ${{ matrix.native_integrity }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
      - name: Verify Windows Administrator authority before resolving its PFX
        id: windows-admin-preflight
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $isAdministrator = [Security.Principal.WindowsPrincipal]::new(
              $identity
            ).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          } finally {
            $identity.Dispose()
          }
          if (-not $isAdministrator) {
            throw "Windows LocalMachine certificate store requires an Administrator runner"
          }
      - name: Verify closed handoff, reviewed support, and isolated runtime before any secret
        id: verify-credential-boundaries
        shell: bash
        env:
          UNSIGNED_DOWNLOAD_ROOT: ${{ runner.temp }}/mdreader-unsigned-download
          SUPPORT_DOWNLOAD_ROOT: ${{ runner.temp }}/mdreader-support-download
          TAURI_RUNTIME_ROOT: ${{ runner.temp }}/mdreader-tauri-runtime
          BUNDLE_WORKSPACE_ROOT: ${{ runner.temp }}/mdreader-bundle-workspace
          EXPECTED_SUPPORT_SHA256: ${{ needs.prepare.outputs.support_sha256 }}
          EXPECTED_RUNTIME_MANIFEST_SHA256: ${{ steps.establish-tauri-runtime.outputs.runtime_manifest_sha256 }}
          EXPECTED_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          EXPECTED_RELEASE_PLATFORM: ${{ matrix.platform }}
          EXPECTED_RELEASE_TARGET: ${{ matrix.target }}
          EXPECTED_RELEASE_BUNDLES: ${{ matrix.bundles }}
          EXPECTED_RELEASE_BINARY: ${{ matrix.binary }}
          EXPECTED_UPDATER_PUBLIC_KEY_SHA256: ${{ needs.prepare.outputs.updater_public_key_sha256 }}
          EXPECTED_TAURI_CLI_INTEGRITY: 'sha512-R8xGtMpwyetawSqm9kYOuMmEqkhUbvcUy8n0aNXIxollKBLESUu5f4Fx+64hgASYm1H+jSWq6jCW6zqTnH6hqQ=='
          EXPECTED_TAURI_NATIVE_PACKAGE: ${{ matrix.native_package }}
          EXPECTED_TAURI_NATIVE_INTEGRITY: ${{ matrix.native_integrity }}
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const {
            chmodSync,
            copyFileSync,
            lstatSync,
            mkdirSync,
            readFileSync,
            readdirSync,
            rmSync,
            writeFileSync,
          } = require('node:fs');
          const { basename, dirname, join, relative, resolve, sep } = require('node:path');
          const hash = (body) => createHash('sha256').update(body).digest('hex');
          const required = (name) => {
            const value = process.env[name];
            if (!value) throw new Error(`credential boundary is missing ${name}`);
            return value;
          };
          const parse = (path, label) => {
            try {
              return JSON.parse(readFileSync(path, 'utf8'));
            } catch {
              throw new Error(`${label} is not valid JSON`);
            }
          };
          const inventory = (root, excluded = new Set()) => {
            const files = [];
            const walk = (directory) => {
              for (const name of readdirSync(directory).sort()) {
                const path = join(directory, name);
                const relativePath = relative(root, path).split(sep).join('/');
                if (excluded.has(relativePath)) continue;
                const metadata = lstatSync(path);
                if (metadata.isSymbolicLink()) {
                  throw new Error(`symbolic link is forbidden at ${relativePath}`);
                }
                if (metadata.isDirectory()) {
                  walk(path);
                } else if (metadata.isFile()) {
                  const body = readFileSync(path);
                  files.push({
                    path: relativePath,
                    mode: metadata.mode & 0o777,
                    bytes: body.byteLength,
                    sha256: hash(body),
                  });
                } else {
                  throw new Error(`unsupported non-regular entry at ${relativePath}`);
                }
              }
            };
            walk(root);
            return files.sort((left, right) => left.path.localeCompare(right.path));
          };
          const sameFiles = (actual, expected, label) => {
            if (JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`${label} inventory mismatch`);
            }
          };
          const platform = required('EXPECTED_RELEASE_PLATFORM');
          const target = required('EXPECTED_RELEASE_TARGET');
          const bundles = required('EXPECTED_RELEASE_BUNDLES');
          const tuples = {
            macos: ['universal-apple-darwin', 'dmg', 'mdreader-app'],
            windows: ['x86_64-pc-windows-msvc', 'nsis', 'mdreader-app.exe'],
            linux: ['x86_64-unknown-linux-gnu', 'appimage,deb,rpm', 'mdreader-app'],
          };
          const tuple = tuples[platform];
          if (
            !tuple ||
            tuple[0] !== target ||
            tuple[1] !== bundles ||
            tuple[2] !== required('EXPECTED_RELEASE_BINARY')
          ) {
            throw new Error('credentialed platform, target, bundle, and binary tuple is invalid');
          }

          const unsignedDownload = required('UNSIGNED_DOWNLOAD_ROOT');
          const unsignedNames = readdirSync(unsignedDownload);
          if (unsignedNames.length !== 1) {
            throw new Error('exactly one hash-addressed unsigned handoff is required');
          }
          const unsignedRoot = join(unsignedDownload, unsignedNames[0]);
          const unsignedPrefix = `mdreader-unsigned-${platform}-`;
          if (!basename(unsignedRoot).startsWith(unsignedPrefix)) {
            throw new Error('unsigned handoff artifact name is not platform scoped');
          }
          const handoffPath = join(unsignedRoot, 'handoff.json');
          const handoffBytes = readFileSync(handoffPath);
          if (
            basename(unsignedRoot).slice(unsignedPrefix.length) !==
            hash(handoffBytes)
          ) {
            throw new Error('unsigned handoff manifest does not match its hash address');
          }
          const handoff = parse(handoffPath, 'unsigned handoff manifest');
          const iconPaths = [
            'icons/32x32.png',
            'icons/128x128.png',
            'icons/128x128@2x.png',
            'icons/icon.icns',
            'icons/icon.ico',
          ];
          const expectedHandoffPaths = [
            ...iconPaths,
            `target/${target}/release/${tuple[2]}`,
          ].sort();
          if (
            handoff.schemaVersion !== 1 ||
            handoff.version !== required('EXPECTED_RELEASE_VERSION') ||
            handoff.sourceCommit !== required('EXPECTED_SOURCE_COMMIT') ||
            handoff.platform !== platform ||
            handoff.target !== target ||
            handoff.bundles !== bundles ||
            handoff.updaterPublicKeySha256 !==
              required('EXPECTED_UPDATER_PUBLIC_KEY_SHA256') ||
            !Array.isArray(handoff.files) ||
            JSON.stringify(handoff.files.map((entry) => entry.path).sort()) !==
              JSON.stringify(expectedHandoffPaths)
          ) {
            throw new Error('closed unsigned handoff contains an unexpected handoff path or identity');
          }
          const unsignedPayload = join(unsignedRoot, 'payload');
          sameFiles(
            inventory(unsignedPayload).map(({ mode: _mode, ...entry }) => entry),
            [...handoff.files].sort((left, right) => left.path.localeCompare(right.path)),
            'unsigned handoff',
          );

          const supportSha = required('EXPECTED_SUPPORT_SHA256');
          const supportRoot = join(
            required('SUPPORT_DOWNLOAD_ROOT'),
            `mdreader-release-support-${supportSha}`,
          );
          const supportPath = join(supportRoot, 'support.json');
          const supportBytes = readFileSync(supportPath);
          if (hash(supportBytes) !== supportSha) {
            throw new Error('reviewed support does not match its hash address');
          }
          const support = parse(supportPath, 'reviewed support manifest');
          if (
            support.schemaVersion !== 1 ||
            support.sourceCommit !== required('EXPECTED_SOURCE_COMMIT') ||
            !Array.isArray(support.files) ||
            JSON.stringify(support.files.map((entry) => entry.path).sort()) !==
              JSON.stringify([
                'sign-windows-from-store.ps1',
                'windows-minimum.nsh',
              ])
          ) {
            throw new Error('reviewed support manifest is not exact');
          }
          const supportPayload = join(supportRoot, 'payload');
          sameFiles(
            inventory(supportPayload).map(({ mode: _mode, ...entry }) => entry),
            [...support.files].sort((left, right) => left.path.localeCompare(right.path)),
            'reviewed support',
          );

          const runtimeRoot = required('TAURI_RUNTIME_ROOT');
          const runtimePath = join(runtimeRoot, 'runtime.json');
          const runtimeBytes = readFileSync(runtimePath);
          if (
            hash(runtimeBytes) !== required('EXPECTED_RUNTIME_MANIFEST_SHA256')
          ) {
            throw new Error('Tauri runtime manifest changed after inventory');
          }
          const runtime = parse(runtimePath, 'Tauri runtime manifest');
          if (
            runtime.schemaVersion !== 1 ||
            runtime.platform !== platform ||
            runtime.cliVersion !== '2.11.4' ||
            runtime.cliPackage !== '@tauri-apps/cli' ||
            runtime.cliIntegrity !== required('EXPECTED_TAURI_CLI_INTEGRITY') ||
            runtime.nativePackage !== required('EXPECTED_TAURI_NATIVE_PACKAGE') ||
            runtime.nativeIntegrity !== required('EXPECTED_TAURI_NATIVE_INTEGRITY') ||
            !Array.isArray(runtime.files)
          ) {
            throw new Error('Tauri runtime identity is invalid');
          }
          sameFiles(
            inventory(runtimeRoot, new Set(['runtime.json'])),
            [...runtime.files].sort((left, right) => left.path.localeCompare(right.path)),
            'Tauri runtime',
          );
          const nodePath = resolve(runtime.node?.path ?? '');
          const nodeMetadata = lstatSync(nodePath);
          const nodeBody = readFileSync(nodePath);
          if (
            !nodeMetadata.isFile() ||
            nodeMetadata.isSymbolicLink() ||
            runtime.node.mode !== (nodeMetadata.mode & 0o777) ||
            runtime.node.bytes !== nodeBody.byteLength ||
            runtime.node.sha256 !== hash(nodeBody)
          ) {
            throw new Error('Node runtime inventory mismatch');
          }
          const cliPath = join(
            runtimeRoot,
            'node_modules',
            '@tauri-apps',
            'cli',
            'tauri.js',
          );
          const nativeDirectory =
            runtime.nativePackage.slice('@tauri-apps/'.length);
          const cliPackage = parse(
            join(runtimeRoot, 'node_modules', '@tauri-apps', 'cli', 'package.json'),
            'Tauri CLI package',
          );
          const nativePackage = parse(
            join(runtimeRoot, 'node_modules', '@tauri-apps', nativeDirectory, 'package.json'),
            'Tauri native package',
          );
          if (
            cliPackage.name !== '@tauri-apps/cli' ||
            cliPackage.version !== '2.11.4' ||
            nativePackage.name !== runtime.nativePackage ||
            nativePackage.version !== '2.11.4'
          ) {
            throw new Error('Tauri runtime package metadata is invalid');
          }

          const workspace = required('BUNDLE_WORKSPACE_ROOT');
          rmSync(workspace, { recursive: true, force: true });
          const tauriRoot = join(workspace, 'apps', 'mdreader', 'src-tauri');
          const uiDist = join(workspace, 'apps', 'mdreader', 'ui', 'dist');
          mkdirSync(join(tauriRoot, 'src'), { recursive: true, mode: 0o700 });
          mkdirSync(join(tauriRoot, 'icons'), { recursive: true, mode: 0o700 });
          mkdirSync(uiDist, { recursive: true, mode: 0o700 });
          for (const icon of iconPaths.map((path) => path.slice('icons/'.length))) {
            copyFileSync(
              join(unsignedPayload, 'icons', icon),
              join(tauriRoot, 'icons', icon),
            );
          }
          const binaryDestination = join(
            workspace,
            'target',
            target,
            'release',
            tuple[2],
          );
          mkdirSync(dirname(binaryDestination), { recursive: true, mode: 0o700 });
          copyFileSync(
            join(unsignedPayload, 'target', target, 'release', tuple[2]),
            binaryDestination,
          );
          chmodSync(binaryDestination, 0o755);
          const supportDestination = join(workspace, 'scripts', 'release');
          mkdirSync(supportDestination, { recursive: true, mode: 0o700 });
          for (const name of [
            'sign-windows-from-store.ps1',
            'windows-minimum.nsh',
          ]) {
            copyFileSync(join(supportPayload, name), join(supportDestination, name));
          }
          writeFileSync(
            join(tauriRoot, 'Cargo.toml'),
            `[package]\nname = "mdreader-app"\nversion = "${handoff.version}"\nedition = "2021"\ndescription = "MDReader desktop shell"\nlicense = "Apache-2.0 OR MIT"\n\n[features]\ndirect-updater = []\n\n[[bin]]\nname = "mdreader-app"\npath = "src/main.rs"\n`,
            { mode: 0o600 },
          );
          writeFileSync(join(tauriRoot, 'src', 'main.rs'), 'fn main() {}\n', {
            mode: 0o600,
          });
          writeFileSync(join(uiDist, 'index.html'), '<!doctype html><title>MDReader</title>\n', {
            mode: 0o600,
          });
          writeFileSync(
            join(tauriRoot, 'tauri.conf.json'),
            `${JSON.stringify({
              productName: 'MDReader',
              identifier: 'dev.mdreader.app',
              version: handoff.version,
              build: {
                beforeBuildCommand: '',
                frontendDist: '../ui/dist',
              },
              app: {
                windows: [{
                  title: 'MDReader',
                  width: 1120,
                  height: 760,
                  minWidth: 720,
                  minHeight: 480,
                }],
                security: { csp: null },
              },
              bundle: {
                active: true,
                createUpdaterArtifacts: true,
                icon: iconPaths,
              },
            }, null, 2)}\n`,
            { mode: 0o600 },
          );
          writeFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `node_path=${nodePath}`,
              `tauri_entrypoint=${cliPath}`,
              `bundle_workspace=${workspace}`,
              `windows_signer_path=${join(supportDestination, 'sign-windows-from-store.ps1')}`,
              `windows_hook_path=${join(supportDestination, 'windows-minimum.nsh')}`,
            ].join('\n') + '\n',
            { flag: 'a' },
          );
          NODE
      - name: Require macOS release credentials with shell builtins
        id: require-release-secrets-macos
        if: matrix.platform == 'macos'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MDREADER_UPDATER_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.MDREADER_APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MDREADER_APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MDREADER_APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.MDREADER_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.MDREADER_APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MDREADER_APPLE_TEAM_ID }}
        run: |
          for name in \
            TAURI_SIGNING_PRIVATE_KEY \
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD \
