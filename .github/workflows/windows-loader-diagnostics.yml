name: Windows actual desktop loader diagnostic

on:
  # Publishing this dedicated branch explicitly runs diagnostics only; it does
  # not satisfy the separate full Windows acceptance workflow.
  push:
    branches: [ci/reader-windows-loader-diagnostics]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Named candidate ref (dispatch this workflow on that same ref)
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate source commit
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: windows-provider-cache-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never
defaults:
  run:
    shell: pwsh
jobs:
  loader-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Bind diagnostic to the exact dispatched candidate
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF -cne 'refs/heads/ci/reader-windows-loader-diagnostics' -or
                $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') {
              throw 'Loader diagnostics require the explicitly published candidate branch.'
            }
          } elseif ($env:CANDIDATE_REF -cne $env:GITHUB_REF_NAME -or
              $env:CANDIDATE_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:CANDIDATE_SHA -cne $env:GITHUB_SHA) {
            throw 'Dispatch the loader diagnostic on the exact named candidate commit.'
          }
      - name: Checkout immutable diagnostic candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source and pinned toolchain
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout differs from its event commit.' }
          rustup show active-toolchain
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain unavailable.' }
      - name: Reuse the same compatible locked native cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          shared-key: windows-provider-cache
          key: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          cache-on-failure: true
      - name: Identify the native ORT download cache
        run: |
          $localData = [Environment]::GetFolderPath([Environment+SpecialFolder]::LocalApplicationData)
          if (!$localData) { throw 'Windows LocalAppData KnownFolder unavailable.' }
          $artifacts = Join-Path $localData 'ort.pyke.io/dfbin/x86_64-pc-windows-msvc'
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('MDREADER_WINDOWS_ORT_ARTIFACT_ROOT=' + $artifacts)
      - name: Restore the locked ORT download artifacts alongside Cargo
        id: ort_artifacts
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MDREADER_WINDOWS_ORT_ARTIFACT_ROOT }}
          key: windows-x64-ort-download-v1-${{ hashFiles('Cargo.lock') }}
      - name: Verify bounded ORT metadata reconciliation
        run: |
          & ./scripts/development/windows-ort-artifacts.test.ps1
      - name: Verify the bounded import report parser
        run: |
          & ./scripts/development/windows-imports.test.ps1
      - name: Compile and probe the actual desktop test without changing features
        run: |
          $cargoMessages = Join-Path $env:RUNNER_TEMP ('mdreader-app-test-' + [Guid]::NewGuid() + '.jsonl')
          & ./scripts/development/windows-app-test-compile.ps1 -CargoMessages $cargoMessages
          & ./scripts/development/windows-app-test-runtime.ps1 -CargoMessages $cargoMessages
          # This route is diagnostic only. It does not run/accept migration cases;
          # the unchanged full workflow still requires both actual desktop cases.
      - name: Preserve the exact native downloads even after a loader failure
        if: ${{ always() && env.MDREADER_WINDOWS_ORT_CACHE_READY == 'true' && steps.ort_artifacts.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MDREADER_WINDOWS_ORT_ARTIFACT_ROOT }}
          key: ${{ steps.ort_artifacts.outputs.cache-primary-key }}
      - name: Preserve bounded exact import and module observations
        if: ${{ always() && env.MDREADER_WINDOWS_TEST_RUNTIME_REPORT != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-app-test-runtime-${{ github.sha }}
          path: ${{ env.MDREADER_WINDOWS_TEST_RUNTIME_REPORT }}
          if-no-files-found: error
          retention-days: 7
