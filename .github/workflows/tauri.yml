name: tauri

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'crates/**'
      - 'ui/**'
      - 'packages/**'
      - 'e2e-native/**'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/tauri.yml'
      - 'scripts/check-bindings.sh'
      - 'scripts/macos-smoke.sh'
      - 'fixtures/corpus/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MDREADER_SOURCE_COMMIT: ${{ github.sha }}

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Tauri on Linux links against webkit2gtk-4.1; install the system libs
      # before touching cargo. Other OSes ship their webview.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Compile the Tauri app shell
      # for each target OS to catch platform-specific breakage early.
      - name: Cargo check (mdreader-app)
        run: cargo check --locked -p mdreader-app

      # The generated tauri-specta bindings are committed; verify they haven't
      # drifted from the Rust command surface. Ubuntu only — one OS is enough.
      - name: Bindings drift guard
        if: runner.os == 'Linux'
        run: ./scripts/check-bindings.sh

  # --------------------------------------------------------------------------
  # Milestone PT — desktop leg of the UNIFIED harness (WebdriverIO + tauri-driver).
  #
  # Drives the REAL built app's webview DOM through tauri-driver on Linux
  # (WebKitGTK) and Windows (WebView2), running the SAME shared FLOW the macOS
  # mac2 leg runs. macOS is deliberately absent here: WKWebView exposes no
  # WebDriver, so the Mac path is the appium-mac2-driver leg (see `macos-smoke`).
  #
  # The harness (e2e-native) lives OUTSIDE the pnpm workspace, so it
  # installs its Appium/WebdriverIO toolchain on demand with `npm ci` (NOT
  # `pnpm install`, which walks up to the root pnpm-workspace.yaml and installs the
  # workspace instead of these deps, leaving webdriverio absent). This matches
  # scripts/macos-smoke.sh and never touches the root lockfile. It is authored +
  # wired but CI-validated-pending: it has not yet
  # run green end-to-end (the macOS dev box cannot execute tauri-driver). First
  # real run may need driver-version tuning (msedgedriver on Windows;
  # WebKitWebDriver on Linux).
  # --------------------------------------------------------------------------
  desktop-e2e:
    name: desktop e2e (unified wdio + tauri-driver) (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # WebKitGTK + its WebDriver (WebKitWebDriver, from webkit2gtk-driver), plus
      # xvfb so the headed webview has a display in CI.
      - name: Install Tauri + WebDriver system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            webkit2gtk-driver \
            xvfb

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: e2e-${{ matrix.os }}

      # Build the workspace deps (@mdreader/ui, @mdreader/markdown) then the app
      # bundle. The app binary tauri-driver launches lands at
      # target/release/mdreader-app[.exe].
      - name: Build isolated MDReader E2E app
        run: |
          pnpm --filter "@mdreader/app..." run build
          pnpm --filter @mdreader/app tauri build --bundles app --features e2e-build --config src-tauri/tauri.e2e.conf.json

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # msedgedriver must match the runner's WebView2/Edge for the Windows leg.
      - name: Install Edge WebDriver (Windows)
        if: runner.os == 'Windows'
        uses: browser-actions/setup-edge@v1

      - name: Install e2e-native toolchain
        working-directory: e2e-native
        run: npm ci

      - name: Typecheck the GUI suite
        working-directory: e2e-native
        run: pnpm run typecheck

      - name: Verify native E2E seed isolation
        working-directory: e2e-native
        run: pnpm run test:seed

      - name: Run desktop e2e (Linux, headed under xvfb)
        if: runner.os == 'Linux'
        working-directory: e2e-native
        run: xvfb-run -a pnpm run test:desktop

      - name: Run desktop e2e (Windows)
        if: runner.os == 'Windows'
        working-directory: e2e-native
        run: pnpm run test:desktop

  # --------------------------------------------------------------------------
  # Milestone PT — macOS leg of the UNIFIED harness (appium-mac2-driver / XCUITest).
  #
  # This is the ONLY leg that exercises the real app on macOS (WKWebView has no
  # WebDriver). It drives the native window through a mac2 (XCUITest) WebDriver
  # session — real titlebar drag (with a content-area negative control) + real
  # red-X close — and reads the webview UI through WebKit's Accessibility tree
  # (`AXDOMClassList`). `scripts/macos-smoke.sh` builds the app, installs the mac2
  # driver into a local APPIUM_HOME, and runs `runners/macos.ts`.
  #
  # It CANNOT run on GitHub-hosted macOS runners: XCUITest (WebDriverAgentMac)
  # needs FULL Xcode + xcodebuild + code-signing, Accessibility reads need the TCC
  # Accessibility grant, and the capture oracle needs Screen-Recording — approvals
  # a hosted runner can't give non-interactively; there it would only ERROR, never
  # false-pass. (It no longer needs the AppleScript/Automation grant — mac2 drives
  # over XCUITest, not System Events.) It is therefore a DOCUMENTED MANUAL /
  # SELF-HOSTED gate: run `scripts/macos-smoke.sh` locally (its output is the
  # acceptance evidence), or enable it on a self-hosted macOS GUI runner.
  #
  # This job is wired so it can ONLY ever land on a self-hosted GUI runner, never
  # on hosted macos-latest:
  #   - the `if` gate keeps it skipped entirely unless the repo variable
  #     MACOS_GUI_RUNNER is set to 'true'; and
  #   - `runs-on` selects the labels [self-hosted, macOS, mdreader-gui]. GitHub
  #     dispatches this to a self-hosted runner carrying those labels ONLY — with
  #     no such runner registered it stays queued and is never scheduled onto a
  #     hosted image. Register your GUI runner with the `mdreader-gui` label (full
  #     Xcode selected, TCC granted) to enable the gate. See docs/testing/gui-e2e.md.
  # --------------------------------------------------------------------------
  macos-smoke:
    name: macOS GUI smoke (unified mac2 leg, self-hosted GUI gate)
    needs: check
    if: ${{ vars.MACOS_GUI_RUNNER == 'true' }}
    runs-on: [self-hosted, macOS, mdreader-gui]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-smoke

      # Builds the .app (if missing) and runs the unified mac2 runner. Exits
      # non-zero on any failed step.
      - name: Run macOS GUI smoke
        run: ./scripts/macos-smoke.sh

  # --------------------------------------------------------------------------
  # Native mobile Appium legs. Each job builds its own E2E-identity artifact,
  # validates the bundle/package before exporting it to WebdriverIO, and then
  # exercises the mobile-specific shell flow. Repository variables keep these
  # expensive jobs guarded; an enabled job fails on every missing native input.
  # --------------------------------------------------------------------------
  ios-e2e:
    name: iOS e2e (unsigned simulator + appium-xcuitest)
    needs: check
    if: ${{ vars.MDREADER_IOS_E2E_READY == 'true' }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust iOS Simulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Prepare disposable iOS E2E worktree
        shell: bash
        run: |
          fingerprint=$(
            git ls-files -z src-tauri/gen/apple \
              | xargs -0 shasum -a 256 \
              | shasum -a 256 \
              | cut -d ' ' -f 1
          )
          worktree="$RUNNER_TEMP/mdreader-ios-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach "$worktree" "$GITHUB_SHA"
          printf 'MDREADER_PRODUCTION_APPLE_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"
          printf 'MDREADER_IOS_E2E_WORKTREE=%s\n' "$worktree" >> "$GITHUB_ENV"

      - name: Install workspace dependencies in disposable worktree
        shell: bash
        run: |
          cd "$MDREADER_IOS_E2E_WORKTREE"
          pnpm install --frozen-lockfile

      - name: Initialize and build unsigned iOS Simulator archive
        shell: bash
        run: |
          cd "$MDREADER_IOS_E2E_WORKTREE"
          pnpm --filter @mdreader/app tauri ios init --ci
          node e2e-native/build-mobile-e2e.mjs ios

      - name: Validate and export iOS app
        shell: bash
        run: |
          app="$MDREADER_IOS_E2E_WORKTREE/src-tauri/gen/apple/build/mdreader-app_iOS.xcarchive/Products/Applications/MDReader E2E.app"
          if [[ ! -d "$app" ]]; then
            echo "expected archived iOS app is missing: $app" >&2
            exit 1
          fi
          node --experimental-strip-types --no-warnings \
            "$MDREADER_IOS_E2E_WORKTREE/e2e-native/validate-artifact.ts" \
            ios \
            "$app" \
            "$GITHUB_SHA"
          printf 'MDREADER_IOS_APP=%s\n' "$app" >> "$GITHUB_ENV"

      - name: Select an available iPhone Simulator
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const runtimes = JSON.parse(
            execFileSync('xcrun', ['simctl', 'list', 'devices', 'available', '--json'], {
              encoding: 'utf8',
            }),
          ).devices;
          const match = Object.entries(runtimes)
            .flatMap(([runtime, devices]) => devices.map((device) => ({ runtime, device })))
            .find(({ device }) => device.isAvailable && device.name.startsWith('iPhone'));
          if (!match) throw new Error('no available iPhone Simulator');
          const version = match.runtime.match(/iOS-(.+)$/)?.[1]?.replaceAll('-', '.');
          if (!version) throw new Error(`cannot parse Simulator runtime ${match.runtime}`);
          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `MDREADER_IOS_DEVICE=${match.device.name}\nMDREADER_IOS_VERSION=${version}\nMDREADER_IOS_UDID=${match.device.udid}\n`,
          );
          NODE

      - name: Install e2e-native toolchain
        shell: bash
        run: |
          cd "$MDREADER_IOS_E2E_WORKTREE/e2e-native"
          npm ci

      - name: Typecheck the GUI harness
        shell: bash
        run: |
          cd "$MDREADER_IOS_E2E_WORKTREE/e2e-native"
          pnpm run typecheck

      - name: Verify artifact and seed guards
        shell: bash
        run: |
          cd "$MDREADER_IOS_E2E_WORKTREE/e2e-native"
          pnpm run test:seed

      - name: Run iOS e2e (Simulator)
        shell: bash
        run: |
          cd "$MDREADER_IOS_E2E_WORKTREE/e2e-native"
          pnpm run test:ios

      - name: Verify production Apple tree and remove disposable worktree
        if: always()
        shell: bash
        run: |
          status=0
          fingerprint=$(
            git ls-files -z src-tauri/gen/apple \
              | xargs -0 shasum -a 256 \
              | shasum -a 256 \
              | cut -d ' ' -f 1
          )
          [[ "$fingerprint" == "$MDREADER_PRODUCTION_APPLE_FINGERPRINT" ]] || {
            echo "production Apple target changed during the E2E build" >&2
            status=1
          }
          git diff --exit-code -- src-tauri/gen/apple || status=1
          test -z "$(git status --porcelain --untracked-files=all -- src-tauri/gen/apple)" \
            || status=1
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER: dev.mdreader.app' \
            src-tauri/gen/apple/project.yml \
            || status=1
          if [[ -n "${MDREADER_IOS_E2E_WORKTREE:-}" && -d "$MDREADER_IOS_E2E_WORKTREE" ]]; then
            git worktree remove --force "$MDREADER_IOS_E2E_WORKTREE" || status=1
          fi
          exit "$status"

  android-e2e:
    name: Android e2e (debug APK + appium-uiautomator2)
    needs: check
    if: ${{ vars.MDREADER_ANDROID_E2E_READY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Rust Android emulator target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated Android E2E project
        shell: bash
        run: |
          test -f src-tauri/gen/android/gradlew || {
            echo "the committed production Tauri Android project is missing" >&2
            exit 1
          }
          production_project="$RUNNER_TEMP/mdreader-android-production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mv src-tauri/gen/android "$production_project"
          pnpm --filter @mdreader/app tauri android init \
            --config src-tauri/tauri.e2e.conf.json \
            --ci

      - name: Build MDReader Android debug APK
        run: node e2e-native/build-mobile-e2e.mjs android

      - name: Validate and export Android APK
        shell: bash
        run: |
          apks=$(find src-tauri/gen/android -type f -name '*.apk' -print)
          count=$(printf '%s\n' "$apks" | sed '/^$/d' | wc -l | tr -d ' ')
          if [[ "$count" -ne 1 ]]; then
            echo "expected exactly one Android APK; found $count" >&2
            exit 1
          fi
          apk=$(realpath "$apks")
          node --experimental-strip-types --no-warnings \
            e2e-native/validate-artifact.ts \
            android \
            "$apk" \
            "$GITHUB_SHA"
          printf 'MDREADER_ANDROID_APP=%s\n' "$apk" >> "$GITHUB_ENV"

      - name: Install e2e-native toolchain
        working-directory: e2e-native
        run: npm ci

      - name: Typecheck the GUI harness
        working-directory: e2e-native
        run: pnpm run typecheck

      - name: Verify artifact and seed guards
        working-directory: e2e-native
        run: pnpm run test:seed

      - name: Run Android e2e (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-port: 5554
          working-directory: e2e-native
          script: MDREADER_ANDROID_UDID=emulator-5554 pnpm run test:android
