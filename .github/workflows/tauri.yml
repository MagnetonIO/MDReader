name: tauri

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/mdreader/**'

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Tauri on Linux links against webkit2gtk-4.1; install the system libs
      # before touching cargo. Other OSes ship their webview.
      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Check-only for P0 — no `tauri build`. This compiles the Tauri app shell
      # for each target OS to catch platform-specific breakage early.
      - name: Cargo check (mdreader-app)
        run: cargo check -p mdreader-app

      # The generated tauri-specta bindings are committed; verify they haven't
      # drifted from the Rust command surface. Ubuntu only — one OS is enough.
      - name: Bindings drift guard
        if: runner.os == 'Linux'
        run: ./scripts/check-bindings.sh
