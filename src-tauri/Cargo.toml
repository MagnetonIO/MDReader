[package]
name = "mdreader-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MDReader desktop shell (Tauri 2)"
publish = false

[features]
default = ["google-drive-connector", "dropbox-connector"]
direct-updater = ["dep:tauri-plugin-updater"]
e2e-build = []
google-drive-connector = ["dep:catdb-connector-google-drive"]
dropbox-connector = ["dep:catdb-connector-dropbox"]

[lib]
# The `_lib` suffix keeps the library name distinct from the binary so the two
# don't collide on Windows (see rust-lang/cargo#8519). The binary is the thin
# `main.rs` shim; all real logic lives in the library so mobile targets (P6)
# can reuse it via `run()`.
name = "mdreader_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
serde = { workspace = true }
serde_json = { workspace = true }
specta = "=2.0.0-rc.25"
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-opener = "2.5.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }
notify-debouncer-mini = "0.7.0"
blake3 = "1.8.5"
regex = "1"
tempfile = "3"
# Advisory `flock` on the save target so the hash-check → temp-write → rename
# window is atomic against other cooperating writers (same `fs2` mechanism as the
# engine's import lease); the compare-then-rename TOCTOU is closed by re-verifying
# the on-disk hash under the lock, right before the swap.
fs2 = "0.4"
walkdir = "2.5.0"
same-file = "1.0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
# The embedded CatDB engine and the MDReader domain registration compose the
# real index the shell drives. `catdb-embed` is pulled WITH `local-embed` on so
# the app builds the real semantic embedder (`bge-small-en-v1.5` via ONNX): an
# index is search-ready and the first-run model download is a visible one-time
# cost. The deterministic `HashEmbedder` remains available behind the
# `MDREADER_DEV_HASH_EMBED` runtime flag (dev/CI: no download). `mdreader-ingest`
# stays default-features off to keep its `catdb` bin's ORT *binary* out of the
# app build; we consume only its `registration()` and `scan_root` (public API).
catdb-engine = { path = "../../../catdb/crates/catdb-engine" }
catdb-embed = { path = "../../../catdb/crates/catdb-embed", default-features = false, features = ["local-embed"] }
catdb-storage = { path = "../../../catdb/crates/catdb-storage" }
catdb-storage-sqlite = { path = "../../../catdb/crates/catdb-storage-sqlite" }
catdb-connector-google-drive = { path = "../../../catdb/crates/catdb-connector-google-drive", optional = true }
catdb-connector-dropbox = { path = "../../../catdb/crates/catdb-connector-dropbox", optional = true }
# Schema introspection (the View As / Schema View surfaces) and the kernel
# provenance the Semantic Inspector renders. Read-only: nothing here builds a
# fact, it only describes ones the engine and the extractors produced.
catdb-core = { path = "../../../catdb/crates/catdb-core" }
catdb-connectors = { path = "../../../catdb/crates/catdb-connectors" }
catdb-federation = { path = "../../../catdb/crates/catdb-federation" }
catdb-ir = { path = "../../../catdb/crates/catdb-ir" }
catdb-validation = { path = "../../../catdb/crates/catdb-validation" }
mdreader-domain = { path = "../crates/mdreader-domain" }
mdreader-ingest = { path = "../crates/mdreader-ingest", default-features = false }
uuid = { workspace = true }
# The shell implements `catdb_embed::Embedder` once, for the `DeferredEmbedder`
# that lets the index open before (or without) the model — and that trait is
# `#[async_trait]`, so the impl needs the same macro.
async-trait = { workspace = true }
# `time` for the model-load deadline (a never-finishing download must surface a
# timeout, not hang the import forever).
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
catdb-storage-sqlite = { path = "../../../catdb/crates/catdb-storage-sqlite", features = ["test-migrations"] }
# Index-version rows, so a test can manufacture the reported situation — a
# workspace whose ACTIVE index was embedded by a different model — through the
# storage lifecycle instead of a stand-in embedder.
catdb-catalog = { path = "../../../catdb/crates/catdb-catalog" }
# Parses `commands.rs` into an AST so the structural test can assert the public
# `save_doc` command body is EXACTLY one bare call to the guarded core (a grep can
# be defeated by a method-chain like `save_doc_guarded(..).inspect(..)`).
syn = { version = "2", features = ["full"] }
# The engine-module tests open an in-memory engine and drive a real import (an
# async runtime to block on), and exercise the model-load deadline (`time`).
tokio = { workspace = true, features = ["rt", "macros", "time"] }
