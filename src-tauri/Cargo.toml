[package]
name = "mdreader-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MDReader desktop shell (Tauri 2)"
publish = false

[features]
default = ["google-drive-connector", "dropbox-connector"]
direct-updater = ["dep:tauri-plugin-updater"]
e2e-build = []
google-drive-connector = ["dep:mdreader-connector-google-drive"]
dropbox-connector = ["dep:mdreader-connector-dropbox"]

[lib]
# The `_lib` suffix keeps the library name distinct from the binary so the two
# don't collide on Windows (see rust-lang/cargo#8519). The binary is the thin
# `main.rs` shim; all real logic lives in the library so mobile targets (P6)
# can reuse it via `run()`.
name = "mdreader_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { workspace = true }

[dependencies]
mdreader-mobile-transfer = { package = "tauri-plugin-mdreader-transfer", path = "../crates/mdreader-mobile-transfer" }
zip = { version = "=4.6.1", default-features = false }
mdreader-profile = { path = "../crates/mdreader-profile" }
mdreader-legacy-export = { path = "../crates/mdreader-legacy-export" }
mdreader-core = { path = "../crates/mdreader-core", features = ["device-assets"] }
mdreader-provider = { path = "../crates/mdreader-provider" }
mdreader-credentials = { path = "../crates/mdreader-credentials" }
mdreader-service = { path = "../crates/mdreader-service" }
mdreader-capture = { path = "../crates/mdreader-capture" }
mdreader-mcp = { path = "../crates/mdreader-mcp" }
tauri = { version = "2", features = ["specta"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
specta = { version = "=2.0.0-rc.25", features = ["uuid"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tauri-plugin-store = "2.4.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-os = "2.3.2"
tauri-plugin-updater = { version = "2.10.1", optional = true }
tauri-plugin-opener = "2.5.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
url = "2"
zeroize = { version = "1", features = ["derive"] }
notify-debouncer-mini = "0.7.0"
blake3 = "1.8.5"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2"
regex = "1"
tempfile = "3"
# Advisory `flock` on the save target so the hash-check → temp-write → rename
# window is atomic against other cooperating writers (same `fs2` mechanism as the
# engine's import lease); the compare-then-rename TOCTOU is closed by re-verifying
# the on-disk hash under the lock, right before the swap.
fs2 = "0.4"
walkdir = "2.5.0"
same-file = "1.0.6"
rusqlite = { version = "0.37", features = ["bundled"] }
# Provider kernels and the MDReader SQLite owner are independent of legacy SDKs.
mdreader-connector-google-drive = { path = "../crates/mdreader-connector-google-drive", optional = true }
mdreader-connector-dropbox = { path = "../crates/mdreader-connector-dropbox", optional = true }
uuid = { workspace = true }
async-trait = { workspace = true }
# `time` for the model-load deadline (a never-finishing download must surface a
# timeout, not hang the import forever).
tokio = { workspace = true, features = ["io-util", "net", "sync", "time", "process"] }
time = { version = "0.3", features = ["formatting"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSRunningApplication"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString"] }
mdreader-service = { path = "../crates/mdreader-service", features = ["local-embed", "sync-native"] }
mdreader-sync = { path = "../crates/mdreader-sync", features = ["native-authority"] }
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
mdreader-service = { path = "../crates/mdreader-service", features = ["local-embed", "sync-native"] }
mdreader-sync = { path = "../crates/mdreader-sync", features = ["native-authority"] }
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
mdreader-service = { path = "../crates/mdreader-service", features = ["local-embed", "sync-native"] }
mdreader-sync = { path = "../crates/mdreader-sync", features = ["native-authority"] }
keyring = { version = "3.6.3", features = ["sync-secret-service"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
# Parses `commands.rs` into an AST so the structural test can assert the public
# `save_doc` command body is EXACTLY one bare call to the guarded core (a grep can
# be defeated by a method-chain like `save_doc_guarded(..).inspect(..)`).
syn = { version = "2", features = ["full"] }
# Native async command tests use the existing service owner.
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
mdreader-service = { path = "../crates/mdreader-service", features = ["sync-native", "local-embed"] }
mdreader-sync = { path = "../crates/mdreader-sync", features = ["native-authority"] }
