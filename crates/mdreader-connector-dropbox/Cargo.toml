[package]
name = "mdreader-connector-dropbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mdreader-provider = { path = "../mdreader-provider", features = ["http-client"] }
async-trait = { workspace = true }
base64 = "0.22"
blake3 = "1"
# `DataSource` and the kernel types this connector implements against.
# `default-features = false` deliberately: a connector has no business
# dragging in the engine, the embedder or SQLite.
catdb-sdk = { git = "file:///Users/mlong/Documents/Development/CatDB", tag = "catdb-sdk-v1.0.0", default-features = false, optional = true }
futures-util = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "stream",
] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
thiserror = { workspace = true }
time = { version = "0.3", features = ["parsing"] }
tokio = { workspace = true, features = ["sync", "time"] }
url = "2"
uuid = { workspace = true }
zeroize = "1"

[dev-dependencies]
ring = "0.17"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = ["legacy"]
legacy = ["dep:catdb-sdk"]
dropbox-live-tests = ["legacy"]

[[test]]
name = "live_smoke"
required-features = ["dropbox-live-tests"]

[lints]
workspace = true

[[test]]
name = "dropbox_api_v2_contract"
required-features = ["legacy"]

[dev-dependencies.rusqlite]
version = "0.37"
features = ["bundled"]
