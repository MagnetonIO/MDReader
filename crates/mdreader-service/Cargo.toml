[package]
name = "mdreader-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
sync-transport = ["mdreader-sync/transport"]
sync-native = ["sync-transport", "mdreader-sync/native-authority", "mdreader-core/device-assets"]
local-embed = ["mdreader-core/local-embed"]

[dependencies]
mdreader-profile = { path = "../mdreader-profile" }
mdreader-legacy-export = { path = "../mdreader-legacy-export" }
mdreader-core = { path = "../mdreader-core" }
mdreader-capture = { path = "../mdreader-capture" }
mdreader-sync = { path = "../mdreader-sync" }
mdreader-integrations = { path = "../mdreader-integrations" }
mdreader-provider = { path = "../mdreader-provider" }
mdreader-credentials = { path = "../mdreader-credentials" }
mdreader-connector-google-drive = { path = "../mdreader-connector-google-drive", default-features = false }
mdreader-connector-dropbox = { path = "../mdreader-connector-dropbox", default-features = false }
zeroize = "1.9"
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
fs2 = "0.4"

[dev-dependencies]
keyring = "=3.6.3"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
