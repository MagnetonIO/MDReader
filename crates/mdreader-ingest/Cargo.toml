[package]
name = "mdreader-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The `catdb` binary lives HERE, not in catdb-cli, by design: the platform
# boundary forbids catdb/* from depending on mdreader-*, so the app side is
# the composition root — main() registers the MDReader domain into the
# engine and hands it to the platform's CLI library. See the catdb-cli
# crate docs for the full seam rationale.
[[bin]]
name = "catdb"
path = "src/bin/catdb.rs"

[features]
# Passthrough to catdb-cli (and transitively catdb-embed): compiles the
# fastembed/ORT provider. Default-on so the shipped `catdb` binary embeds
# locally; `--no-default-features` builds stay genuinely ORT-free.
default = ["local-embed"]
local-embed = ["catdb-cli/local-embed"]

[dependencies]
catdb-ir = { path = "../../../../catdb/crates/catdb-ir" }
catdb-engine = { path = "../../../../catdb/crates/catdb-engine" }
catdb-storage = { path = "../../../../catdb/crates/catdb-storage" }
catdb-cli = { path = "../../../../catdb/crates/catdb-cli", default-features = false }
mdreader-domain = { path = "../mdreader-domain" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
blake3 = "1"
comrak = "0.54"
ignore = "0.4"

[dev-dependencies]
catdb-catalog = { path = "../../../../catdb/crates/catdb-catalog" }
# Kernel types for the KN-layer instance validity tests (MemInstance +
# builtin schemas): the app depending on the platform is the allowed
# direction.
catdb-core = { path = "../../../../catdb/crates/catdb-core" }
catdb-embed = { path = "../../../../catdb/crates/catdb-embed", default-features = false }
insta = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tempfile = { workspace = true }
# Read-only inspection of the workspace FILE in `tests/composed_cli.rs`: that
# test proves the `catdb` binary produced a real CatDB workspace (operation
# log, objects/morphisms, execution indexes) rather than an app-private
# format, which means reading it without going through the engine. Not a new
# dependency — the same version and `bundled` feature already compile as part
# of catdb-storage-sqlite, one layer down.
rusqlite = { version = "0.37", features = ["bundled"] }
