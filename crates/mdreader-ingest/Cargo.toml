[package]
name = "mdreader-ingest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lints]
workspace = true

# The `catdb` binary lives HERE, not in catdb-cli, by design: the platform
# boundary forbids catdb/* from depending on mdreader-*, so the app side is
# the composition root — main() registers the MDReader domain into the
# engine and hands it to the platform's CLI library. See the catdb-cli
# crate docs for the full seam rationale.
[[bin]]
name = "catdb"
path = "src/bin/catdb.rs"

[[bin]]
name = "catdb-demo-server"
path = "src/bin/catdb-demo-server.rs"

[[example]]
name = "e2e_read_only_server"
required-features = ["e2e-test-support"]

[features]
# Passthrough to catdb-cli (and transitively catdb-embed): compiles the
# fastembed/ORT provider. Default-on so the shipped `catdb` binary embeds
# locally; `--no-default-features` builds stay genuinely ORT-free.
default = ["local-embed", "external-connectors"]
local-embed = ["catdb-sdk/local-embed"]
# The CLI bundles its enterprise connectors behind one switch, so this rides
# the facade feature that names that coupling rather than reaching past it.
external-connectors = ["catdb-sdk/cli-external-connectors"]
# Integration latch: Task 13B deliberately leaves this unavailable until the
# reviewed Task 3 catalog-revision authority is merged and can verify the
# deployment pin against the opened workspace.
authoritative-catalog = []
# Test-only read composition used by the loopback Playwright harness.
e2e-test-support = ["catdb-sdk/server-e2e-test-support"]

[dependencies]
# The platform as one versioned dependency. `cli` is the composition root
# (`main_with_domains`) this crate builds the shipping binary from; `server`
# is the read-only router the e2e harness drives.
catdb-sdk = { git = "file:///Users/mlong/Documents/Development/CatDB", tag = "catdb-sdk-v1.0.0", features = ["engine", "cli", "server"] }
# Kernel value types (`Object`, `MorphismInstance`, `Provenance`) — the
# proposal store persists them verbatim, so a promoted fact carries the exact
# provenance extraction recorded. The app depending on the platform kernel is
# the allowed direction.
mdreader-domain = { path = "../mdreader-domain" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
blake3 = "1"
sha2 = "0.10"
tempfile = { workspace = true }
axum = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
comrak = "0.54"
ignore = "0.4"
# The proposal store's backing database — reviewable claims live BESIDE the
# workspace index, never inside it. Not a new dependency in the build graph:
# the same version and `bundled` feature already compile as part of
# catdb-storage-sqlite, one layer down.
rusqlite = { version = "0.37", features = ["bundled", "serialize"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
insta = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
