[package]
name = "mdreader-connector-local"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# MDReader's local document-library sources: the filesystem, git and YAML
# frontmatter adapters over a directory of markdown.
#
# These lived in `catdb-connectors` while the two products shared a repository.
# They are not enterprise connectors -- they read one local directory three
# ways, which is a document reader enriching its own library, not a platform
# federating systems of record. They implement `DataSource` against the
# published CatDB facade from outside the platform repo, which is also the
# check that the facade is complete.

[dependencies]
async-trait = { workspace = true }
blake3 = "1"
catdb-sdk = { git = "file:///Users/mlong/Documents/Development/CatDB", tag = "catdb-sdk-v1.0.0", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
uuid = { workspace = true }

[lints]
workspace = true
