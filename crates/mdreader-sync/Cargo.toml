[package]
name = "mdreader-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
transport = ["dep:reqwest", "dep:url", "dep:tokio"]
native-authority = ["transport", "dep:ring", "dep:jsonwebtoken", "dep:keyring"]

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.11"
zeroize = "1.9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"], optional = true }
url = { version = "2", optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }

ring = { version = "0.17", optional = true }
jsonwebtoken = { version = "9.3.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"], optional = true }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"], optional = true }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
ring = "0.17"
jsonwebtoken = "9.3.1"

[lints]
workspace = true
