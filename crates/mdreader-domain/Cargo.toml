[package]
name = "mdreader-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# The platform, as one versioned dependency. `engine` carries the embedded
# database and pulls `embed` and `storage-sqlite` with it; the kernel,
# connectors, federation, query, IR and validation are unconditional in the
# facade, which is why they are not named here.
mdreader-connector-local = { path = "../mdreader-connector-local" }
catdb-sdk = { git = "file:///Users/mlong/Documents/Development/CatDB", tag = "catdb-sdk-v1.0.0", features = ["engine"] }
# The three read-only adapters (filesystem, git, frontmatter) the federated
# `Document` concept is declared over. The platform ships the sources; the
# concept that binds them into one entity is the app's domain.
# Executing ONE query across those adapters, with a per-source account of how
# each one ran. `Federation::assemble_from` attributes that answer, so the
# execution report and the per-field provenance describe the same read instead
# of two reads that happen to agree.
blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
blake3 = "1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
