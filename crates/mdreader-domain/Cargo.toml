[package]
name = "mdreader-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
catdb-core = { path = "../../../../catdb/crates/catdb-core" }
# The three read-only adapters (filesystem, git, frontmatter) the federated
# `Document` concept is declared over. The platform ships the sources; the
# concept that binds them into one entity is the app's domain.
catdb-connectors = { path = "../../../../catdb/crates/catdb-connectors" }
catdb-query = { path = "../../../../catdb/crates/catdb-query" }
catdb-ir = { path = "../../../../catdb/crates/catdb-ir" }
catdb-validation = { path = "../../../../catdb/crates/catdb-validation" }
catdb-engine = { path = "../../../../catdb/crates/catdb-engine" }
blake3 = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
catdb-embed = { path = "../../../../catdb/crates/catdb-embed", default-features = false }
blake3 = "1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
